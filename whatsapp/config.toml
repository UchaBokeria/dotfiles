# wa - default configuration.
#
# This file is embedded in the binary and is the source of every default. Your
# own ~/.config/wa/config.toml is overlaid on top of it, so you only need to
# write the keys you want to change. Keymaps merge rather than replace: adding
# one binding does not wipe the rest.
#
# Change a setting for this session with  :set ui.list_width=40
# Change it permanently with              :set! ui.list_width=40

[ui]
# Width of the chat list, in columns.
list_width = 34
# Below this total width the layout collapses to one pane that Tab switches.
min_width = 80
# Go time layout for a message timestamp.
timestamp = "15:04"
# Go time layout for the day separator between messages.
day_separator = "Monday, 2 January 2006"
# Gutter beside messages: "hybrid" (absolute on the cursor line, relative
# elsewhere, as in Neovim), "number", "relativenumber", or "none".
gutter = "none"
# Lines of context kept above and below the cursor.
scrolloff = 10
# Leave the bars unpainted so a compositor's blur shows through the terminal.
# "auto" turns it on under Hyprland - with hyprglass if that is loaded - and
# off everywhere else. "on" and "off" decide for themselves. Your terminal
# needs its own transparency for this to show: kitty's background_opacity.
glass = "auto"

# Show what can be pressed next, once a key sequence is under way: press the
# leader and the possible continuations appear, with what each one does.
# <BS> steps back out of a group, <Esc> closes.
whichkey = true
# How long to wait before showing it. "0s" shows it immediately.
whichkey_delay = "250ms"

# Bubble shape. "solid" is a filled block with half-block edges, which is the
# nearest a terminal grid gets to a rounded bubble. The rest draw a frame:
# "rounded", "thick", "double", "ascii", or "none" for no frame at all.
border = "solid"
# Widest a message bubble may get, as a percentage of the message pane.
bubble_max_percent = 66
# Message renderer: "bubbles" or "flat".
render = "bubbles"
# Prefix for <leader> in keymaps.
leader = "<Space>"
# Milliseconds to wait for the rest of an ambiguous key sequence.
timeoutlen = 300
# Searching ignores case, unless the pattern contains an upper-case letter.
ignorecase = true
smartcase = true
# "unnamedplus" aliases the unnamed register to the system clipboard, as in
# Neovim. Any other value keeps them separate.
clipboard = "unnamedplus"
# Show a typing indicator to the other side while you compose.
send_typing = true
# Program that opens a file or link in the desktop. Empty means xdg-open.
opener = ""
# Program that opens a link. Empty tries $BROWSER, then a browser on PATH,
# then the desktop's handler - so a server with no browser falls through to
# copying the address instead of failing.
browser = ""
# Make URLs clickable, using OSC 8. A terminal that does not understand it
# shows the text unchanged, so this is safe to leave on; tmux forwards it from
# version 3.4 onwards.
links = true
# Every chip, badge, field and bubble ends in this shape: "pill" (the Nerd Font
# half circles tmux and waybar use), "rounded", or "square".
shape = "pill"
# Pictures instead of words where a picture reads faster: "nerd", "unicode" or
# "ascii". A font without Nerd glyphs draws boxes; pick unicode there.
icon_set = "nerd"
# How a message of several lines is rounded. "half" caps the first and last
# rows and gives the rows between half-block sides that meet them, which reads
# as a rounded card; "ends" keeps those sides full width (a visible step at
# each corner); "all" caps every row (scalloped edges).
bubble_edges = "half"

[lock]
# A password prompt before the interface is drawn. It gates the interface only:
# it does not encrypt the wacli store, which stays readable on disk.
enabled = false
# Re-lock after this much inactivity. "0s" disables.
idle_timeout = "10m"
# Re-lock when the machine resumes from suspend.
on_suspend = true

[sync]
# Start a `wacli sync --follow` process when none is running.
autostart = true
# How often to re-read the store when live updates are unavailable because
# somebody else's sync process holds the lock.
poll_interval = "2s"
# Download media in the background during sync.
download_media = false
# How long to wait for the sync process's delegation socket (.send.sock in the
# store directory) before giving up on a send. The socket appears about a
# second after sync connects, and a send issued before it exists fails with
# "store is locked". Note that wa never passes --lock-wait: measurements in
# docs/delegation-probe.md show it only adds its full duration to every send.
send_socket_wait = "15s"

[media]
# Draw images, video frames and text documents inside the conversation.
# Rendering uses half-block characters and 24-bit colour rather than a terminal
# graphics protocol, so it works in tmux and over ssh, where kitty's protocol
# needs `set -g allow-passthrough on` to survive.
preview = true
# Tallest an inline preview may be, in terminal rows.
rows = 10
# Lines shown from a text document.
text_lines = 6
# Draw photographs as pixels rather than as half blocks, where the terminal
# speaks kitty's graphics protocol - kitty itself, ghostty and wezterm do.
# Inside tmux this also needs `set -g allow-passthrough on`; without it the
# escape never reaches the terminal and nothing is drawn. `wa doctor` says
# which of the two is in use.
graphics = true
# Fetch an attachment this size or smaller as soon as it is drawn, so a
# conversation of photographs shows photographs rather than filenames. Bigger
# ones wait for <leader>d. "0" downloads nothing without being asked.
#
# The download takes no store lock and is not recorded in wacli's store, so
# the files live in wa's own cache under ~/.cache/wa/media.
auto_download = "2MB"
# The largest attachment wacli can fetch. This is wacli's own compiled-in
# limit - MaxMediaDownloadSize in internal/wa/media.go, with no flag and no
# environment variable behind it - and wa only knows it so it can refuse a
# doomed download in a second rather than after a minute of transfer.
#
# Raise it here only if you are running a wacli built with a larger one:
#   ./scripts/wacli-big-media 2GB
max_download = "100MB"

# Names for key groups, so the popup can label a prefix instead of showing a
# bare letter. A prefix with no name here is labelled from what is under it.
# The look. One shape, one icon set and one spacing scale, used by every part
# of the interface, so nothing can drift from the rest.
[ui.layout]
# Empty cells between the screen edge and everything.
margin = 1
# Cells between the chat list and the conversation. Space separates them; the
# focused section says so by coming forward, not by a border.
gap = 2
# Lines per chat in the list: 2 shows the last message under the name.
list_rows = 2
# Blank rows between messages.
bubble_gap = 1
# Space inside a bubble, a field or a popup.
padding = 1

[ui.groups]
"<leader>s" = "settings"
"<leader>i" = "results"
"<leader>f" = "find"
"<leader>F" = "find in this chat"
"<leader>t" = "toggle"
"<leader>g" = "chat"
"<leader>n" = "contacts"
"<leader>V" = "select"

[theme]
# [theme.colors] below replaces single palette roles - accent, bubble_mine,
# raised, selection, any key of theme.toml - on top of the palette in use.
# With no file of our own, take the colours wallust or pywal pulled out of the
# wallpaper - the same ones the bar, the launcher and the rest of the desktop
# are using. `wa doctor` says which file was found.
follow_wallpaper = true
# Path to a palette written by `blackwall-theme wa`. Empty means the palette
# embedded in the binary, so wa looks right on a machine without the dotfiles.
file = ""

[wacli]
bin = "wacli"
# Named account from wacli's config.yaml. Empty uses its default.
account = ""
# Store directory. Empty uses wacli's own default.
store = ""
# Timeout for a single wacli invocation.
timeout = "30s"
# How long wacli holds the connection open after sending, so it can answer a
# retry receipt itself. Its own default is 2s, which is two seconds added to
# every message, reaction and forward. The sync process is already connected
# and answers those receipts, so wa asks for none.
post_send_wait = "0s"

# ---------------------------------------------------------------------------
# Keymaps
#
# Bind a key notation to an action name. `:actions` lists every action,
# `<leader>sk` opens the keymap picker, and an unknown action name here stops
# startup with the offending line rather than binding a key that does nothing.
# ---------------------------------------------------------------------------

[keys.normal]
"j" = "nav.down"
"k" = "nav.up"
"<Down>" = "nav.down"
"<Up>" = "nav.up"
"h" = "nav.left"
"l" = "nav.right"
"gg" = "nav.top"
"G" = "nav.bottom"
"<C-d>" = "nav.half_down"
"<C-u>" = "nav.half_up"
"<C-f>" = "nav.page_down"
"<C-b>" = "nav.page_up"
"H" = "nav.view_top"
"M" = "nav.view_middle"
"L" = "nav.view_bottom"
"}" = "nav.block_next"
"{" = "nav.block_prev"
"zz" = "view.center"
"zt" = "view.top"
"zb" = "view.bottom"

# Tab moves between the conversation and the input box, which is the pair you
# swap between constantly. Shift-Tab cycles all three sections.
"<Tab>" = "pane.toggle"
"<S-Tab>" = "pane.cycle"
"<leader><Tab>" = "pane.toggle_back"
"<leader><S-Tab>" = "pane.cycle_back"
"<C-h>" = "pane.left"
"<C-l>" = "pane.right"
"<C-j>" = "pane.down"
"<C-k>" = "pane.up"

"i" = "mode.insert"
"a" = "mode.insert_after"
"A" = "mode.insert_line_end"
"I" = "mode.insert_line_start"
"o" = "mode.open_below"
"O" = "mode.open_above"
"v" = "mode.visual"
"V" = "mode.visual_line"
":" = "mode.cmdline"
"/" = "mode.search_forward"
"?" = "mode.search_backward"

"n" = "search.next"
"N" = "search.prev"
"<Esc>" = "search.clear"

"<CR>" = "select.open"
"y" = "edit.operator_yank"
"d" = "edit.operator_delete"
"c" = "edit.operator_change"
"gu" = "edit.operator_lower"
"gU" = "edit.operator_upper"
"g~" = "edit.operator_toggle_case"
"x" = "edit.delete_char"
"s" = "edit.substitute_char"
"D" = "edit.delete_to_end"
"C" = "edit.change_to_end"
"p" = "edit.put_after"
"P" = "edit.put_before"
"u" = "edit.undo"
"<C-r>" = "edit.redo"
"." = "repeat.last"

# The input box's own motions. They do nothing while the conversation has the
# keyboard - press Tab first - so the two sections never fight over a key.
"w" = "edit.word_next"
"W" = "edit.word_next_big"
"b" = "edit.word_prev"
"B" = "edit.word_prev_big"
"e" = "edit.word_end"
"0" = "edit.line_start"
"^" = "edit.line_first_nonblank"
"$" = "edit.line_end"

"q" = "macro.record"
"@" = "macro.play"
"m" = "mark.set"
"'" = "mark.jump"
"`" = "mark.jump_exact"
"<C-o>" = "jump.back"
"<C-i>" = "jump.forward"
# Vim's alternate file, for chats: back to the one you were just in.
"<C-^>" = "chat.alternate"
"<C-6>" = "chat.alternate"

"<leader>i" = "qf.toggle"
"<leader>in" = "qf.next"
"<leader>iN" = "qf.prev"
"<leader>io" = "qf.open"
"<leader>ip" = "qf.picker"
"<leader><leader>" = "picker.chats"
"<leader>sk" = "picker.keys"
"<leader>ss" = "picker.actions"
"<leader>sr" = "app.reload"
# The finder. <leader>f<x> searches every chat, <leader>F<x> only the open one.
"<leader>fm" = "find.messages"
"<leader>ff" = "find.messages"
"<leader>fa" = "find.media"
"<leader>fi" = "find.images"
"<leader>fv" = "find.video"
"<leader>fo" = "find.audio"
"<leader>fd" = "find.docs"
"<leader>fl" = "find.links"
"<leader>fs" = "find.starred"
"<leader>Fm" = "find.chat_messages"
"<leader>Ff" = "find.chat_messages"
"<leader>Fa" = "find.chat_media"
"<leader>Fi" = "find.chat_images"
"<leader>Fv" = "find.chat_video"
"<leader>Fo" = "find.chat_audio"
"<leader>Fd" = "find.chat_docs"
"<leader>Fl" = "find.chat_links"
"<leader>Fs" = "find.chat_starred"
"<leader>tf" = "list.filter_cycle"
"<leader>a" = "chat.archive_toggle"
"<leader>p" = "chat.pin_toggle"
"<leader>m" = "chat.mute_toggle"
"<leader>r" = "chat.read_toggle"
"r" = "msg.reply"
"Y" = "msg.copy"
"<leader>e" = "msg.react"
"<leader>w" = "msg.forward"
"<leader>d" = "msg.download"
"<leader>D" = "media.download_chat"
"<leader>M" = "media.summary"
"<leader>P" = "media.toggle_preview"
"<leader>o" = "msg.open"
"<leader>x" = "msg.delete"
"<leader>k" = "msg.info"
# Browse for a file, or type its path if you know it. The paperclip in front
# of the input box opens the same browser.
"<leader>u" = "msg.attach"
"<leader>A" = "msg.attach_path"
"<leader>U" = "msg.detach"
"<leader>v" = "msg.paste"
"<leader>c" = "chat.info"
"<leader>C" = "chat.stats"

# Multi-select, the way visual block starts in vim: mark, mark, mark, then one
# action for all of them. <Esc> drops the marks.
"<C-v>" = "select.mark"
"<leader>Vb" = "select.block"
"<leader>Vc" = "select.clear_marks"
"<leader>Vn" = "select.multi_cursor"
# In the input box: a cursor on every occurrence of the word, the way
# vim-visual-multi does it.
"<C-n>" = "select.multi_cursor"
"<C-Down>" = "select.cursor_below"
"<C-Up>" = "select.cursor_above"

# The chat drawer: what the phone app puts behind a long press. They all act on
# the marked chats when there are any.
"<leader>gf" = "chat.favourite_toggle"
"<leader>ge" = "chat.export"
"<leader>gc" = "chat.clear"
"<leader>gr" = "chat.mark_read"
"<leader>gu" = "chat.mark_unread"
"<leader>ga" = "chat.archive"
"<leader>gA" = "chat.unarchive"
"<leader>gm" = "chat.mute"
"<leader>gM" = "chat.unmute"
"<leader>gp" = "chat.pin"
"<leader>gP" = "chat.unpin"
"<leader>gb" = "chat.block"
"<leader>gd" = "chat.disappearing"
"<leader>gx" = "chat.delete"

# The address book.
"<leader>nn" = "contacts.open"
"<leader>nr" = "contact.rename"
"<leader>nt" = "contact.tag"
"<leader>na" = "contact.add"
"<leader>nf" = "contact.forget"
"<leader>." = "menu.open"
"<leader>l" = "app.lock"
"<leader>sl" = "app.lock_set"
"<leader>?" = "app.help"
"<leader>L" = "app.log"
"ZZ" = "app.quit"

[keys.insert]
"<Esc>" = "mode.normal"
"<C-c>" = "mode.normal"
"<CR>" = "insert.accept"
"<M-CR>" = "insert.newline"
"<C-w>" = "insert.delete_word_back"
"<M-BS>" = "insert.delete_word_back"
"<C-u>" = "insert.delete_to_start"
"<C-k>" = "insert.delete_to_end"
# Readline keys, because half of writing a message is fixing the start of it
# and leaving insert mode to do that is a tax.
"<C-a>" = "insert.line_start"
"<C-e>" = "insert.line_end"
"<M-b>" = "insert.word_back"
"<M-f>" = "insert.word_forward"
"<C-r>" = "insert.put_register"
# Paste what the system clipboard holds. A picture is attached to the message
# rather than typed into it, which is the only sensible reading of pasting one.
"<C-v>" = "msg.paste"
"<BS>" = "insert.backspace"
"<Del>" = "insert.delete"
"<Left>" = "nav.left"
"<Right>" = "nav.right"
"<Up>" = "nav.up"
"<Down>" = "nav.down"

[keys.visual]
"<Esc>" = "mode.normal"
"j" = "nav.down"
"k" = "nav.up"
"h" = "nav.left"
"l" = "nav.right"
"gg" = "nav.top"
"G" = "nav.bottom"
"<C-d>" = "nav.half_down"
"<C-u>" = "nav.half_up"
"y" = "visual.yank"
"d" = "visual.delete"
"c" = "visual.change"
"gu" = "visual.lower"
"gU" = "visual.upper"
"o" = "visual.other_end"
"v" = "mode.normal"
":" = "mode.cmdline"

[keys.cmdline]
"<CR>" = "cmdline.accept"
"<Esc>" = "cmdline.cancel"
"<Tab>" = "cmdline.complete"
"<S-Tab>" = "cmdline.complete_back"
"<C-p>" = "cmdline.history_prev"
"<C-n>" = "cmdline.history_next"
"<Up>" = "cmdline.history_prev"
"<Down>" = "cmdline.history_next"
"<BS>" = "cmdline.backspace"
"<C-w>" = "cmdline.delete_word_back"
"<C-u>" = "cmdline.clear"

[keys.search]
"<CR>" = "search.accept"
"<Esc>" = "search.cancel"
"<BS>" = "search.backspace"
"<C-w>" = "search.delete_word_back"
"<C-u>" = "search.clear_input"

# Motions available to operators and to plain cursor movement inside a text
# buffer. The left side is the key, the right side is a motion the engine
# knows; `:motions` lists them.
[keys.motion]
"h" = "left"
"l" = "right"
"j" = "down"
"k" = "up"
"0" = "line_start"
"^" = "line_first_nonblank"
"$" = "line_end"
"w" = "word_next"
"W" = "word_next_big"
"b" = "word_prev"
"B" = "word_prev_big"
"e" = "word_end"
"E" = "word_end_big"
"ge" = "word_end_prev"
"f" = "find_char"
"F" = "find_char_back"
"t" = "till_char"
"T" = "till_char_back"
";" = "repeat_find"
"," = "repeat_find_reverse"
"%" = "match_pair"
"(" = "sentence_prev"
")" = "sentence_next"
"{" = "paragraph_prev"
"}" = "paragraph_next"
"gg" = "buffer_start"
"G" = "buffer_end"

# Text objects, addressed as <i|a><key>.
[keys.textobj]
"w" = "word"
"W" = "word_big"
"\"" = "quote_double"
"'" = "quote_single"
"`" = "quote_back"
"(" = "paren"
")" = "paren"
"b" = "paren"
"[" = "bracket"
"]" = "bracket"
"{" = "brace"
"}" = "brace"
"B" = "brace"
"<lt>" = "angle"
"<gt>" = "angle"
"p" = "paragraph"
"s" = "sentence"

# Replace single icons by name, whatever icon_set is. :help lists the names.
[icons]
