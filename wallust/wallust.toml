backend = "full"
color_space = "lab"
palette = "dark"
threshold = 10

[templates.gtk3]
template = "gtk3.css"
target = "/home/bu/.themes/wallust/gtk-3.0/colors.css"

[templates.rofi]
template = "rofi.rasi"
target = "~/.config/rofi/colors/wallust.rasi"

[templates.wlogout]
template = "wlogout.css"
target   = "~/.config/wlogout/colors/colors.css"

[templates.waybar]
template = "waybar.css"
target   = "~/.config/waybar/colors.css"

[templates.eww]
template = "eww.scss"
target   = "~/.config/eww/colors.scss"

[templates.kitty]
template = "kitty.conf"
target   = "~/.config/kitty/colors.conf"

