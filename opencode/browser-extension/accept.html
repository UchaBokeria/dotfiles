<!doctype html>
<html>
<head><meta charset="utf-8"><title>opencode connect request</title><style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(1200px 600px at 50% -10%, #16233a 0%, #0b0d10 60%);
  color: #e8edf2; font: 15px/1.6 system-ui, -apple-system, sans-serif; }
.card { width: min(560px, 90vw); background: rgba(20,24,29,.92); border: 1px solid #232a32;
  border-radius: 20px; padding: 36px 40px; text-align: center;
  box-shadow: 0 24px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06); }
h2 { margin: 0 0 6px; font-size: 22px; font-weight: 700; letter-spacing: .2px; }
p { color: #9aa4ae; margin: 6px 0 14px; }
.sess { font-family: ui-monospace, monospace; font-size: 14px; background: #0b0d10;
  border: 1px solid #232a32; border-radius: 12px; padding: 10px 14px; word-break: break-all; }
button { font-size: 16px; font-weight: 650; padding: 13px 40px; margin-top: 22px; cursor: pointer;
  color: #fff; border: 0; border-radius: 14px;
  background: linear-gradient(135deg, #1a73e8, #7b5cff);
  box-shadow: 0 8px 28px rgba(60,100,255,.35); transition: transform .08s ease; }
button:hover { transform: translateY(-1px); }
#done { display: none; color: #34d399; font-size: 17px; margin-top: 20px; }
.hint { margin-top: 16px; font-size: 12px; color: #69727c; }
</style></head>
<body>
<div class="card">
<h2>Connect this browser?</h2>
<p>opencode session requesting access:</p>
<div class="sess" id="sess"></div>
<button id="accept">Accept — connect</button>
<div id="done">Connected. This tab closes itself.</div>
<div class="hint">You can revoke anytime by closing the session.</div>
</div>
<script src="accept.js"></script>
</body>
</html>
