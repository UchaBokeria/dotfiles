<!doctype html>
<html>
<head><meta charset="utf-8"><style>
:root { color-scheme: dark; --bg:#0b0d10; --card:#14181d; --line:#232a32;
  --txt:#e8edf2; --dim:#9aa4ae; --acc:#1a73e8; --acc2:#7b5cff; }
* { box-sizing: border-box; }
body { width: 260px; margin: 0; padding: 14px; background: var(--bg); color: var(--txt);
  font: 13px/1.5 system-ui, -apple-system, sans-serif; }
#bname { font-weight: 700; font-size: 13px; margin-bottom: 2px; }
.sub { color: var(--dim); font-size: 12px; margin-bottom: 10px; }
button { display: block; width: 100%; margin: 7px 0; border: 0; border-radius: 11px;
  padding: 10px; font-size: 13px; font-weight: 600; cursor: pointer;
  background: #1c232c; color: var(--txt); text-align: left; }
button:hover { filter: brightness(1.2); }
button.primary { background: linear-gradient(135deg, var(--acc), var(--acc2)); color: #fff; text-align: center; }
#status { color: var(--dim); font-size: 12px; margin-top: 8px; min-height: 15px; }
</style></head>
<body>
<div id="bname">opencode</div>
<div class="sub" id="stateline">Launcher — workspace lives in the side panel.</div>
<button id="open-panel" class="primary">Open workspace</button>
<button id="q-snap">Snapshot this tab</button>
<button id="q-shot">Screenshot this tab</button>
<button id="q-accept">Accepts (<span id="pcount">0</span>)</button>
<div id="status"></div>
<script src="popup.js"></script>
</body>
</html>
