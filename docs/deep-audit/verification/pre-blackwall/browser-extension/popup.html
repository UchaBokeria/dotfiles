1: <!doctype html>
2: <html>
3: <head><meta charset="utf-8"><style>
4: :root { color-scheme: dark; --bg:#0b0d10; --card:#14181d; --line:#232a32;
5:   --txt:#e8edf2; --dim:#9aa4ae; --acc:#1a73e8; --acc2:#7b5cff; }
6: * { box-sizing: border-box; }
7: body { width: 260px; margin: 0; padding: 14px; background: var(--bg); color: var(--txt);
8:   font: 13px/1.5 system-ui, -apple-system, sans-serif; }
9: #bname { font-weight: 700; font-size: 13px; margin-bottom: 2px; }
10: .sub { color: var(--dim); font-size: 12px; margin-bottom: 10px; }
11: button { display: block; width: 100%; margin: 7px 0; border: 0; border-radius: 11px;
12:   padding: 10px; font-size: 13px; font-weight: 600; cursor: pointer;
13:   background: #1c232c; color: var(--txt); text-align: left; }
14: button:hover { filter: brightness(1.2); }
15: button.primary { background: linear-gradient(135deg, var(--acc), var(--acc2)); color: #fff; text-align: center; }
16: #status { color: var(--dim); font-size: 12px; margin-top: 8px; min-height: 15px; }
17: </style></head>
18: <body>
19: <div id="bname">opencode</div>
20: <div class="sub" id="stateline">Launcher — workspace lives in the side panel.</div>
21: <button id="open-panel" class="primary">Open workspace</button>
22: <button id="q-snap">Snapshot this tab</button>
23: <button id="q-shot">Screenshot this tab</button>
24: <button id="q-accept">Accepts (<span id="pcount">0</span>)</button>
25: <div id="status"></div>
26: <script src="popup.js"></script>
27: </body>
28: </html>
