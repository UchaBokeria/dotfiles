1: <!doctype html>
2: <html>
3: <head><meta charset="utf-8"><title>opencode connect request</title><style>
4: :root { color-scheme: dark; }
5: * { box-sizing: border-box; }
6: body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
7:   background: radial-gradient(1200px 600px at 50% -10%, #16233a 0%, #0b0d10 60%);
8:   color: #e8edf2; font: 15px/1.6 system-ui, -apple-system, sans-serif; }
9: .card { width: min(560px, 90vw); background: rgba(20,24,29,.92); border: 1px solid #232a32;
10:   border-radius: 20px; padding: 36px 40px; text-align: center;
11:   box-shadow: 0 24px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06); }
12: h2 { margin: 0 0 6px; font-size: 22px; font-weight: 700; letter-spacing: .2px; }
13: p { color: #9aa4ae; margin: 6px 0 14px; }
14: .sess { font-family: ui-monospace, monospace; font-size: 14px; background: #0b0d10;
15:   border: 1px solid #232a32; border-radius: 12px; padding: 10px 14px; word-break: break-all; }
16: button { font-size: 16px; font-weight: 650; padding: 13px 40px; margin-top: 22px; cursor: pointer;
17:   color: #fff; border: 0; border-radius: 14px;
18:   background: linear-gradient(135deg, #1a73e8, #7b5cff);
19:   box-shadow: 0 8px 28px rgba(60,100,255,.35); transition: transform .08s ease; }
20: button:hover { transform: translateY(-1px); }
21: #done { display: none; color: #34d399; font-size: 17px; margin-top: 20px; }
22: .hint { margin-top: 16px; font-size: 12px; color: #69727c; }
23: </style></head>
24: <body>
25: <div class="card">
26: <h2>Connect this browser?</h2>
27: <p>opencode session requesting access:</p>
28: <div class="sess" id="sess"></div>
29: <button id="accept">Accept — connect</button>
30: <div id="done">Connected. This tab closes itself.</div>
31: <div class="hint">You can revoke anytime by closing the session.</div>
32: </div>
33: <script src="accept.js"></script>
34: </body>
35: </html>
