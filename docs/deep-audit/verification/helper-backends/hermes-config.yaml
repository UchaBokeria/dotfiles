1164:   discord: [hermes-discord]
1165:   whatsapp: [hermes-whatsapp]
1166:   slack: [hermes-slack]
1167:   signal: [hermes-signal]
1168:   qqbot: [hermes-qqbot]
1169:   yuanbao: [hermes-yuanbao]
1170:   teams: [hermes-teams]
