236: #
237: # --- Container resource limits (docker, singularity, modal, daytona -- ignored for local/ssh) ---
238: # These settings apply to all container backends. They control the resources
239: # allocated to the sandbox and whether its filesystem persists across sessions.
240:   container_cpu: 1              # CPU cores
241:   container_memory: 5120        # Memory in MB (5120 = 5GB)
242:   container_disk: 51200         # Disk in MB (51200 = 50GB)
243:   container_persistent: true    # Persist filesystem across sessions (false = ephemeral)
