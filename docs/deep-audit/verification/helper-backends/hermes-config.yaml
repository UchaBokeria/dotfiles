7: # Schema version of this file. The installers copy it to seed config.yaml, and
8: # `hermes update` uses it to know which one-time migrations the file already
9: # has. Hermes manages it: do not copy it into another config.
10: _config_version: 50
11: 
12: # =============================================================================
13: # Database Configuration
14: # =============================================================================
15: # WAL is the normal default. Hermes automatically falls back to DELETE when
16: # SQLite reports that WAL is incompatible with the filesystem. Set this to
17: # "delete" explicitly for deployments whose backing filesystem is not WAL
18: # crash-safe, such as Linux containers bind-mounted through macOS virtiofs,
19: # NFS, or SMB. Hermes will not live-downgrade a database already open in WAL.
20: database:
21:   journal_mode: "wal"  # Supported values: "wal", "delete"
22:   # Optional WAL sizing pragmas (integers). Unset = SQLite defaults.
23:   # wal_autocheckpoint: 1000     # pages between automatic checkpoints
24:   # journal_size_limit: 67108864 # cap the WAL/journal file size in bytes
25:   #
26:   # Durability level for every state.db connection: OFF, NORMAL, FULL, EXTRA
27:   # (or 0-3). Unset leaves SQLite's default, which is baked in at compile time
28:   # (SQLITE_DEFAULT_WAL_SYNCHRONOUS) and therefore differs between the bundled
29:   # interpreter, a distro python3 and a Homebrew one. Set it if you need to
30:   # know which one you are running rather than infer it. On macOS this is a
31:   # floor, not a pin: values below FULL are refused because Darwin's fsync()
32:   # does not guarantee write ordering, while EXTRA is honored normally.
33:   # synchronous: FULL
34: 
35: # =============================================================================
36: # Runtime Limits
37: # =============================================================================
38: # Long-running Hermes server processes raise their RLIMIT_NOFILE soft limit to
39: # this value when the operating system permits it. The value is clamped to the
40: # hard limit and never lowers an already higher soft limit. Set to 0, false, or
41: # null to disable the adjustment. Default: 4096.
42: runtime:
43:   nofile_soft_limit: 4096
44: 
45: # =============================================================================
46: # Attachments
47: # =============================================================================
48: # Where the TUI/Desktop gateway stages session file attachments (file uploads and
49: # pasted text). Read per profile: a session bound to profile X follows X's own
50: # config.yaml, so each agent's attachments stay with its workspace.
51: #   hermes-home  (default) <profile home>/attachments — the directory container
52: #                 backends bind-mount, so @file: refs resolve inside the sandbox.
53: #   workspace    <session workspace>/.hermes/attachments — staging lands inside
54: #                 the allowed reference root, so the profile's agent can always
55: #                 read its own attachments back. A remote (ssh) workspace keeps
56: #                 the profile home directory either way.
57: attachments:
58:   storage: "hermes-home"
