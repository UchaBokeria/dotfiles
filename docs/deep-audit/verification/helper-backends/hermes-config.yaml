1520: # =============================================================================
1521: # Session Logging
1522: # =============================================================================
1523: # Session trajectories are automatically saved to logs/ directory.
1524: # Each session creates: logs/session_YYYYMMDD_HHMMSS_UUID.json
1525: #
1526: # The session ID is displayed in the welcome banner for easy reference.
1527: # Logs contain full conversation history in trajectory format:
1528: # - System prompt, user messages, assistant responses
1529: # - Tool calls with inputs/outputs
1530: # - Timestamps for debugging
1531: #
1532: # No configuration needed - logging is always enabled.
1533: # To disable, you would need to modify the source code.
1534: 
1535: # =============================================================================
1536: # Code Execution Sandbox (Programmatic Tool Calling)
1537: # =============================================================================
1538: # The execute_code tool runs Python scripts that call Hermes tools via RPC.
1539: # Intermediate tool results stay out of the LLM's context window.
1540:   provider: local
1541: code_execution:
1542:   timeout: 300         # Max seconds per script before kill (default: 300 = 5 min)
1543:   max_tool_calls: 50   # Max RPC tool calls per execution (default: 50)
1544:   # Local execution uses a persistent session kernel: variables, imports, and
1545:   # loaded data survive across execute_code calls in one conversation, so
1546: [CREDENTIAL-RELATED LINE OMITTED]
1547:   # reset=true on a call to discard state; a timed-out/interrupted cell kills
1548:   # the kernel (next call starts fresh). Remote terminal backends currently
1549:   # run per-call (remote kernel host is tracked follow-up work). Security
1550:   # scrubbing, tool whitelist, and output redaction are identical either way.
1551:   # kernel_idle_timeout: 1800   # Reap kernels idle longer than this (seconds)
1552:   # max_session_kernels: 4      # Process-wide LRU cap on live kernels
1553: 
1554: # =============================================================================
1555: # Subagent Delegation
1556: # =============================================================================
1557: # The delegate_task tool spawns child agents with isolated context.
1558: # Supports single tasks and batch mode (default 3 parallel, configurable).
1559: delegation:
1560:   max_iterations: 250                         # Max tool-calling turns per child (default: 250)
1561:   # max_concurrent_children: 10               # Max parallel child agents per batch (default: 10, floor: 1, no ceiling).
1562:                                               # WARNING: values above 10 multiply API cost linearly.
1563:   # max_spawn_depth: 1                        # Delegation tree depth cap (range: 1-3, default: 1 = flat).
1564:                                               # Raise to 2 to allow workers to spawn their own subagents.
1565:                                               # Requires role="orchestrator" on intermediate agents.
1566:   # orchestrator_enabled: true                # Kill switch for role="orchestrator" children (default: true).
1567:   # subagent_auto_approve: false              # When a subagent hits a dangerous-command approval prompt, auto-deny (default: false)
1568:                                               # or auto-approve "once" (true) instead of blocking on stdin.
1569:                                               # The parent TUI owns stdin, so blocking would deadlock; non-interactive resolution is required.
1570:                                               # Both choices emit a logger.warning audit line. Flip to true only for cron/batch pipelines.
1571:   # inherit_mcp_toolsets: true                # When explicit child toolsets are narrowed, also keep the parent's MCP toolsets (default: true). Set false for strict intersection.
1572:   # model: "google/gemini-3-flash-preview"    # Override model for subagents (empty = inherit parent)
1573:   # provider: "openrouter"                    # Override provider for subagents (empty = inherit parent)
1574: [CREDENTIAL-RELATED LINE OMITTED]
1575:   #                                           # Supported: openrouter, nous, zai, kimi-coding, minimax
1576:   #                                           # Cost tip: keep the parent on a frontier model and pin
1577:   #                                           # delegation.model to an inexpensive one — children carry the
1578: [CREDENTIAL-RELATED LINE OMITTED]
1579:   #                                           # planning quality stays with the frontier parent.
1580:   # fallback_providers:                       # Fallback chain for delegated children (same entry format as the
1581:   #   - provider: "openrouter"                # top-level list). Pinned children use only a declared child chain;
1582:   #     model: "deepseek/deepseek-chat"       # unpinned children inherit when unset. [] disables fallback (#65038).
