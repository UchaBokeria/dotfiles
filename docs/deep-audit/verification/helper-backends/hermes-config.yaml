1868: # =============================================================================
1869: # Telemetry
1870: # =============================================================================
1871: # Shared metrics are disabled by default. When enabled, Hermes writes only
1872: # allowlisted aggregate counters and immutable JSON
1873: # packages under $HERMES_HOME/telemetry/shared_metrics.
1874: # Packages include a random profile-scoped ID that stays stable until this
1875: # directory is deleted. It is not derived from hardware, account, or host data.
1876: # Successfully exported local history is retained for 30 days; pending deltas
1877: # are retained until they can be exported.
1878: # This profile-owned choice is not overridden by managed-scope configuration.
1879: #
1880: # Nothing is uploaded unless you also set `send: true`. That is a separate
1881: # opt-in and requires `enabled`; it never turns collection on by itself.
1882: # When sending is on:
1883: #   * only packages whose entire collection period falls within one
1884: #     continuous recorded consent window are ever sent. Consent windows open
1885: #     when you enable sending and close when you disable it, so data
1886: #     collected before you opted in — or during any gap between opt-ins —
1887: #     stays on this machine;
1888: #   * each package carries the profile-scoped ID as-is. It is a random UUID
1889: #     with no hardware, account, or host-derived content, and deleting the
1890: #     shared-metrics directory resets it.
1891: # See docs/observability/relay-shared-metrics.md (Appendix A) for the full
1892: # consent, identity, retention, and deletion decisions.
1893:   pet:
1894:     enabled: true
1895:     slug: boba
1896: telemetry:
1897:   shared_metrics:
1898:     enabled: true
1899:     send: true
1900:     # endpoint: https://telemetry.nousresearch.com/v1/telemetry
