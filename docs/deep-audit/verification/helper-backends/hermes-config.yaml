885:   # Inactivity timeout for gateway agent runs (seconds, 0 = unlimited).
886:   # The agent can run indefinitely when actively calling tools or receiving
887:   # API responses.  Only fires after the agent has been idle for this duration.
888:   # gateway_timeout: 1800
889: 
890:   # Maximum time an alias routing key waits for an active turn holding the same
891:   # resolved session lease. On expiry Hermes rejects this inbound message and
892:   # asks the user to resend rather than running it without serialization.
893:   # Non-positive values fall back to the 5-second default.
894:   # gateway_turn_lease_timeout: 5
895: 
896:   # Staged warning: send a warning before escalating to full timeout.
897:   # Fires once per run when inactivity reaches this threshold (seconds).
898:   # Set to 0 to disable the warning.
899:   # gateway_timeout_warning: 900
900: 
901:   # Session stall watchdog (seconds). When a busy session has a pending
902:   # inbound follow-up and the agent activity clock is idle this long, the
903:   # gateway logs a WARNING and notifies the user to try /new. Does not kill
904:   # the turn (see gateway_timeout). 0 = disable. Default 300.
905:   # session_stall_timeout: 300
906: 
907:   # Transcript-sanitiser repeated-heal escalation (#96870). The pre-send
908:   # sanitiser silently repairs empty non-final turns on the wire copy; after
909:   # this many heal passes within a 10-minute session window Hermes logs one
910:   # ERROR (with session id + heal pattern) and sends a ONE-TIME out-of-band
911:   # notice to the user suggesting /debug share or `hermes doctor`. The notice
912:   # goes through the status channel only — conversation context and prompt
913:   # caching are untouched. Set 0 to disable escalation (per-window WARNINGs
914:   # still fire). Default 3.
915:   # sanitizer_heal_escalation_threshold: 3
916: 
917:   # Related in-agent compression timeouts (they live under the top-level
918:   # compression: block, shown here for discoverability next to the stall
919:   # watchdog they complement — a hung compression is a common stall cause):
920:   # compression:
921:   #   context_timeout_seconds: 120          # inactivity budget for in-agent
922:   #                                         # compress_context (0 = disable)
923:   #   context_total_ceiling_seconds: 600    # absolute cap on the pre-commit
924: [CREDENTIAL-RELATED LINE OMITTED]
925: 
926:   # Graceful drain timeout for gateway stop/restart (seconds).
927:   # Default 0 = no drain: a restart interrupts in-flight agents immediately,
928:   # cleans up, and exits. Set a positive value only if you want a grace
929:   # window on /restart, and keep it well under systemd's TimeoutStopSec.
930:   # restart_drain_timeout: 0
931: 
932:   # Floor under the same drain for cron jobs and api_server (/v1) runs
933:   # (seconds). Default 30.
934:   # restart_drain_timeout above is written for chat turns, which are cheap to
935:   # interrupt: the user is told the gateway is restarting and the session
936:   # resumes on their next message. A cron run has no such safety net — it is
937:   # recorded in jobs.json as a permanent failure, nobody is waiting on it, and
938:   # a recurring job simply skips to its next schedule. So in-flight cron work
939:   # gets its own grace window instead of inheriting the 0 above, and so do
940:   # api_server (/v1) runs: an interrupted /v1 run fails its waiting caller.
941:   # Clamped at runtime to the shutdown-watchdog leash (restart_drain_timeout
942:   # + 60s) minus teardown headroom, so values past ~50s need a matching
943:   # TimeoutStopSec bump to take effect. Set 0 to opt out and drain cron and
944:   # /v1 runs on restart_drain_timeout like before.
945:   # cron_drain_timeout: 30
946: 
947:   # In-band restart wait (seconds) for active turns to finish BEFORE stop()
948:   # begins. /restart and SIGUSR1 refuse new work, then wait up to this cap for
949:   # in-flight agent, cron and API runs to complete so the requesting turn is
950:   # not cut off by restart_drain_timeout. 0 = enter stop()/drain immediately.
951:   # Excluded from the wait: wedged runs, and cron runs already handed to a
952:   # worker in its own restart-safe systemd scope (they outlive the restart).
953:   # The default (30 min) is a safety valve for wedged agents, not a target
954:   # latency; raise it for long unattended turns. Env: HERMES_RESTART_AFTER_TURN_TIMEOUT.
955:   # restart_after_turn_timeout: 1800
956: 
957:   # Upper bound (seconds) a submitted prompt waits for the deferred agent
958:   # build (MCP discovery, model metadata, skills scan) before failing with a
959:   # visible error. The wait is patient — the message is delivered as soon as
960:   # the build completes, and a progress notice is shown past 30s — so this cap
961:   # only fires on a genuinely hung build. Raise it for deployments with many
962:   # slow or unreachable MCP servers. Default 600.
963:   # build_wait_timeout: 600
964: 
965:   # Max app-level retry attempts for API errors (connection drops, provider
966:   # timeouts, 5xx, etc.) before the agent surfaces the failure. Lower this
967:   # to 1 if you use fallback providers and want fast failover on flaky
968:   # primaries (default 3). The OpenAI SDK does its own low-level retries
969:   # underneath this wrapper — this is the Hermes-level loop.
970:   # api_max_retries: 3
