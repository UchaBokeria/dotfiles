1598: # =============================================================================
1599: # Display
1600: # =============================================================================
1601:   subagent_auto_approve: true
1602: display:
1603:   # Use compact banner mode (hides the ASCII-art banner, shows a single line).
1604:   #   true:  Compact single-line banner
1605:   #   false: Full ASCII banner with tool/skill summary (default)
1606:   compact: false
1607: 
1608:   # Tool progress display level (CLI, gateway, and the TUI/Desktop tool feed)
1609:   #   off:     Silent — no tool activity shown, just the final response
1610:   #   new:     Show a tool indicator only when the tool changes (skip repeats)
1611:   #   all:     Show every tool call with a short preview (default)
1612:   #   verbose: Full args, results, and debug logs (same as /verbose)
1613:   #   log:     Silent in chat; append every tool call to ~/.hermes/logs/tool_calls.log (gateway only)
1614:   # Toggle at runtime with /verbose in the CLI
1615:   # Independent of show_reasoning: hiding reasoning never hides tool rows.
1616:   # Answer-only (just the final response) is show_reasoning: false plus
1617:   # tool_progress: off.
1618:   # tool_progress: all
1619: 
1620:   # tool_progress, interim_assistant_messages, long_running_notifications,
1621:   # busy_ack_detail and show_reasoning are left unset here on purpose: a value
1622:   # set under display: applies to EVERY messaging platform and replaces its
1623:   # built-in default. To change one platform, set it under
1624:   # display.platforms.<platform> instead.
1625:   #
1626:   # Per-platform defaults can be quieter than the CLI. Telegram
1627:   # tunes for mobile: tool_progress and busy_ack_detail default off (no
1628:   # per-tool breadcrumb stream, no "iteration 21/60" debug detail in busy
1629:   # acks or heartbeats), but interim_assistant_messages and
1630:   # long_running_notifications STAY ON so the user has real signal between
1631:   # turn start and final answer (mid-turn assistant commentary + a single
1632:   # edit-in-place "⏳ Working — N min" heartbeat). Override under
1633:   # display.platforms.telegram.
1634: 
1635:   # Auto-cleanup of temporary progress bubbles after the final response lands.
1636:   # On platforms that support message deletion (currently Telegram), this
1637:   # removes the tool-progress bubble, "⏳ Still working..." notices, and
1638:   # context-pressure status messages once the final reply has been delivered —
1639:   # keeping long-running turns visible live, then tidy afterward. Failed runs
1640:   # leave the bubbles in place as breadcrumbs. Off by default.
1641:   # Per-platform override: display.platforms.telegram.cleanup_progress
1642:   #   true:  Delete tracked progress/status bubbles on successful turn
1643:   #   false: Leave everything in place (default)
1644:   # Example:
1645:   #   display:
1646:   #     platforms:
1647:   #       telegram:
1648:   #         cleanup_progress: true
1649:   cleanup_progress: false
1650: 
1651:   # Natural mid-turn assistant updates.
1652:   # On gateway platforms, when true, completed assistant status messages are
1653:   # sent as separate chat messages. On the Desktop app, when true, mid-turn
1654:   # assistant narration streamed between tool calls is kept in the transcript
1655:   # instead of the bubble collapsing to only the final message on completion.
1656:   # Independent of tool_progress and gateway streaming.
1657:   #   true:  Keep/send mid-turn assistant updates (default; off on platforms
1658:   #          that cannot edit messages)
1659:   #   false: Only keep/send the final response
1660:   # interim_assistant_messages: true
1661: 
1662:   # Opt-in: hide automatic warning/diagnostic notifications (compression, retry
1663:   # and fallback notices, credit/subagent failure lines, inactivity and watchdog
1664:   # stalls, media-delivery fallbacks, cron failure alerts) on this surface.
1665:   # Requested results, approvals, clarifications and command outcomes are never
1666:   # hidden, and nothing is removed from the logs. Per-platform override under
1667:   # display.platforms.<platform>.suppress_warning_notifications.
1668:   suppress_warning_notifications: false
1669: 
1670:   # Gateway-only long-running status heartbeats.
1671:   # When false, the platform does not receive periodic "⏳ Working — N min"
1672:   # notifications even if agent.gateway_notify_interval is non-zero. The
1673:   # heartbeat edits a single message in place (where the adapter supports
1674:   # editing) instead of posting a new bubble each interval.
1675:   # Default: true, including Telegram (silent agents are worse than a single
1676:   # edit-in-place heartbeat); false on Slack and on platforms that cannot edit.
1677:   # long_running_notifications: true
1678: 
1679:   # Include detailed iteration/tool/status context in busy acknowledgments
1680:   # and long-running heartbeats. When true, busy acks show "iteration 21/60,
1681:   # terminal, 10 min" and the heartbeat shows "⏳ Working — 12 min,
1682:   # iteration 21/60, terminal". When false (Telegram, Slack and no-edit
1683:   # platform default), both stay terse: "Interrupting current task" and
1684:   # "⏳ Working — 12 min, terminal".
1685:   # busy_ack_detail: true
1686: 
1687:   # What Enter does when Hermes is already busy (CLI and gateway platforms).
1688:   #   interrupt: Interrupt the current run and redirect Hermes (default)
1689:   #   queue:     Queue your message for the next turn
1690:   #   steer:     Inject your message mid-run via /steer, arriving at the agent
1691:   #              after the next tool call — no interrupt, no role violation.
1692:   #              Falls back to 'queue' if the agent isn't running yet or if
1693:   #              images are attached (steer only carries text).
1694:   # Ctrl+C (or /stop in gateway) always interrupts regardless of this setting.
1695:   # Toggle at runtime with /busy <interrupt|queue|steer>.
1696:   busy_input_mode: interrupt
1697: 
1698:   # Background process notifications (gateway/messaging only).
1699:   # Controls how chatty the process watcher is when you use
1700:   # terminal(background=true, notify_on_complete=true) from Telegram/Discord/etc.
1701:   #   concise: One-line status message on completion; failures include a short
1702:   #            output tail (default)
