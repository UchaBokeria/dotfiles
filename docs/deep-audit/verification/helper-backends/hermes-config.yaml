972:   # Once api_max_retries AND the fallback chain are spent on a transient outage
973:   # (5xx, overloaded/529, connect/read timeouts) and nothing has been delivered
974:   # yet, Hermes waits and retries this many more cycles (jittered 15/30/60/60/60s;
