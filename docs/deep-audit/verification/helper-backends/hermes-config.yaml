1834: # Register shell scripts as plugin-hook callbacks.  Each entry is executed as
1835: # a subprocess (shell=False, shlex.split) with a JSON payload on stdin.  On
1836: # stdout the script may return JSON that either blocks the tool call or
1837: # injects context into the next LLM call.
