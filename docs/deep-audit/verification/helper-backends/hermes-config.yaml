876: # =============================================================================
877: # Agent Behavior
878: # =============================================================================
879: agent:
880:   # Maximum tool-calling iterations per conversation (default: 500)
881: [CREDENTIAL-RELATED LINE OMITTED]
882:   # Recommended: 20-30 for focused tasks, 50-100 for open exploration
883:   max_turns: 500
