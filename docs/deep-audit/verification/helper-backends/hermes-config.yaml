1020:   reasoning_effort: "medium"
1021: 
1022:   # Per-model reasoning effort overrides (optional dict)
1023:   # Key: any sensible model spelling works (exact, dots↔dashes interchangeable,
1024:   #      provider prefix optional). First match wins.
1025:   # Value: reasoning effort level (same options as reasoning_effort, dict form included)
1026:   # Override the global reasoning_effort for that specific model.
1027:   # NOTE: no `hermes config set` support for this key -- edit YAML directly.
1028:   # reasoning_overrides:
1029:   #   "openrouter/anthropic/claude-opus-4.5": "xhigh"
1030:   #   "openai/gpt-5": "low"
1031:   #   "claude-opus-4.6": "high"           # bare model name also works
1032:   #   "deepseek/deepseek-v4-pro": "xhigh" # dots and dashes are interchangeable
1033: 
1034:   # Fast mode (OpenAI Priority Processing / xAI Grok 4.6 / Anthropic Fast Mode
1035:   # on Opus 4.8+). Premium pricing; only sent to first-party endpoints.
1036:   #   "" / "normal" - off (default)
1037:   #   "fast"        - every request
1038:   #   "auto"        - only the first fast_auto_seconds of every turn
1039:   #   "cold"        - that window on the first turn of a session only
1040:   # Also: /fast normal|fast|auto|cold [--global]
1041:   service_tier: ""
1042:   fast_auto_seconds: 60
1043: 
1044:   # Custom personalities (use with /personality command).
1045:   # Built-ins (helpful, concise, technical, creative, teacher, kawaii, catgirl,
1046:   # pirate, shakespeare, surfer, noir, uwu, philosopher, hype) are always
