1393: # =============================================================================
1394: # Voice Transcription (Speech-to-Text)
1395: # =============================================================================
1396: # Automatically transcribe voice messages on messaging platforms.
1397: # Providers: local (free, faster-whisper) | groq (free tier) | openai (Whisper API) | mistral (Voxtral Transcribe)
1398: [CREDENTIAL-RELATED LINE OMITTED]
1399: stt:
1400:   enabled: true
1401:   # provider: "local"          # auto-detected if omitted
1402:   # --- Cloud pre-upload silence trim (groq/openai/mistral/xai/elevenlabs/deepinfra) ---
1403:   # Local whisper gets Silero VAD; cloud endpoints otherwise receive raw audio —
1404:   # silence inflates upload time, per-audio-minute billing, and hallucination risk.
1405:   # Collapses pauses with ffmpeg client-side; clips under 12s skip the trim, and
1406:   # on any failure the original uploads untouched.
1407:   # cloud_trim_silence: true   # set false to always upload the original audio
1408:   # cloud_trim_threshold_db: -40  # audio quieter than this counts as silence
1409:   # cloud_trim_keep_ms: 300    # how much of each pause survives (keeps natural pacing)
1410:   # Optional static transcription prompt: vocabulary/context hints for
1411:   # prompt-capable backends. Composition is deterministic: this config value
1412:   # is the base, then `pre_transcription` hooks run in registration order with
1413:   # last-writer-wins semantics per field.
1414:   #
1415:   # Privacy: the final prompt is sent to the configured STT provider alongside
1416: [CREDENTIAL-RELATED LINE OMITTED]
1417:   # that provider.
1418:   #
1419:   # Length / truncation contract: Whisper-family backends (local, openai,
1420: [CREDENTIAL-RELATED LINE OMITTED]
1421:   # truncates longer prompts client-side (keeping the tail) with a WARNING
1422:   # log — never an error. Other backends own their own validation.
1423:   #
1424:   # Provider behavior:
1425:   #   local (faster-whisper)  -> `initial_prompt`, forwarded unchanged
1426:   #   openai / groq          -> `prompt`, forwarded unchanged
1427:   #   mistral                -> `prompt`, forwarded unchanged
1428:   #   deepinfra              -> OpenAI-compatible `prompt`, unchanged
1429:   #   local_command/xai/
1430:   #   elevenlabs             -> unsupported; DEBUG log, then continue
1431:   #   plugin providers       -> `prompt` in `**extra`; plugin owns limits
1432:   # prompt: "Hermes, Teknium, Nous Research, kanban"
1433:   local:
1434:     model: "base"              # tiny | base | small | medium | large-v3 | turbo
1435:     # language: ""             # auto-detect; set to "en", "es", "fr", etc. to force
1436:     # initial_prompt: ""       # Optional faster-whisper prompt, e.g. bias Chinese output to simplified Chinese
1437:     # --- Anti-hallucination hardening (whisper decodes junk from silence without these) ---
1438:     # vad: true                # Silero VAD filter (default on) — silence never reaches whisper.
1439:     #                          # Set false to restore raw behavior (e.g. transcribing music/ambient audio).
1440:     # vad_min_silence_ms: 500  # min silence (ms) that splits speech chunks when vad is on
1441:     # no_speech_prob_threshold: 0.6  # drop a segment only if no_speech_prob > this...
1442:     # logprob_threshold: -1.0       # ...AND avg_logprob < this (both must hit — quiet real speech survives)
1443:     # unload_after_idle_seconds: 0  # 0=never unload (default); e.g. 300 releases the model after 5min idle (frees VRAM on GPU; next voice message reloads it)
1444:   language: "en"               # GLOBAL language hint for every STT provider (per-provider language wins). Set "" for auto-detect.
1445:   # groq:
1446:   #   model: "whisper-large-v3-turbo"
1447:   #   language: ""             # blank = stt.language > HERMES_LOCAL_STT_LANGUAGE > auto-detect
1448:   openai:
1449:     model: "whisper-1"         # whisper-1 | gpt-4o-mini-transcribe | gpt-4o-transcribe | gpt-transcribe
1450:     language: ""               # auto-detect; set to "en", "es", "fr", etc. to force
1451:     timeout: 60                # request timeout in seconds; increase for self-hosted model cold starts
1452:     max_retries: 1             # OpenAI SDK transport retries; set 0 to disable
1453:   # mistral:
1454:   #   model: "voxtral-mini-latest"  # voxtral-mini-latest | voxtral-mini-2602
1455:   # xai:
1456:   #   # Sent as the multipart ``model`` field. Hermes uses 2.0 by default;
1457:   #   # pin 1.0 only if a rollback is needed.
1458:   #   model: "grok-voice-transcribe-2.0"  # or grok-voice-transcribe-1.0
1459:   #   # language: ""             # blank = stt.language > HERMES_LOCAL_STT_LANGUAGE > auto-detect
1460:   # deepinfra:
1461:   #   # Model id is discovered live from the DeepInfra catalog filtered
1462:   #   # by the `stt` surface tag — leave `model` blank to take the first
1463:   #   # live result. Pin only when you need a specific Whisper variant.
1464:   #   model: ""
