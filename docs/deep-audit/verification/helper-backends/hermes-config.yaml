120: # =============================================================================
121: # Terminal Tool Configuration
122: # =============================================================================
123: # Choose ONE of the following terminal configurations by uncommenting it.
124: # The terminal tool executes commands in the specified environment.
125: 
126: # -----------------------------------------------------------------------------
127: # OPTION 1: Local execution (default)
128: # Commands run directly on your machine in the current directory
129: # -----------------------------------------------------------------------------
130: # Working directory behavior:
131: #   - CLI (`hermes` command): Uses "." (current directory where you run hermes)
132: #   - Gateway/messaging/cron: Uses terminal.cwd here; legacy .env cwd values are deprecated
133:   dispatch_in_gateway: false
134: cron:
135:   catch_up_missed: true  # False skips past-grace recurring misses after planned downtime.
136: 
137: terminal:
138:   backend: "local"
139:   cwd: "."  # For local backend: "." = current directory. Ignored for remote backends unless a backend documents otherwise.
140:   # Desktop xterm font. Install the font locally; Nerd Fonts render Powerlevel10k glyphs.
141:   # font_family: "MesloLGS NF"  # Also accepts a CSS stack; blank uses bundled JetBrains Mono.
142:   timeout: 180
143:   # HOME policy for tool subprocesses:
144:   #   auto    - default: host uses your real HOME; containers use HERMES_HOME/home
145:   #   real    - force your real OS-user HOME
146:   #   profile - force HERMES_HOME/home for strict per-profile CLI config isolation
147:   home_mode: "auto"
148:   docker_mount_cwd_to_workspace: false  # SECURITY: off by default. Opt in to mount the launch cwd into Docker /workspace.
149:   lifetime_seconds: 300
150: [CREDENTIAL-RELATED LINE OMITTED]
151: [CREDENTIAL-RELATED LINE OMITTED]
152: 
153: # -----------------------------------------------------------------------------
154: # OPTION 2: SSH remote execution
155: # Commands run on a remote server - agent code stays local (sandboxed)
156: # Great for: keeping agent isolated from its own code, using powerful remote hardware
157: # -----------------------------------------------------------------------------
158: # terminal:
159: #   backend: "ssh"
160: #   cwd: "/home/myuser/project"  # Path on the REMOTE server
161: #   timeout: 180
162: #   lifetime_seconds: 300
163: #   ssh_host: "my-server.example.com"
164: #   ssh_user: "myuser"
165: #   ssh_port: 22
166: #   ssh_key: "~/.ssh/id_rsa"  # Optional - uses ssh-agent if not specified
167: 
168: # -----------------------------------------------------------------------------
169: # OPTION 3: Docker container
170: # Commands run in an isolated Docker container
171: # Great for: reproducible environments, testing, isolation
172: # -----------------------------------------------------------------------------
173: # terminal:
174: #   backend: "docker"
175: #   cwd: "/workspace"  # Path INSIDE the container (default: /)
176: #   timeout: 180
177: #   lifetime_seconds: 300
178: #   docker_image: "nousresearch/hermes-sandbox:desktop"
179: #   docker_mount_cwd_to_workspace: true   # Explicit opt-in: mount your launch cwd into /workspace
180: #   # Optional: run the container as your host user's uid:gid so files written
181: #   # into bind-mounted dirs are owned by you, not root. Drops SETUID/SETGID
182: #   # caps too since no gosu privilege drop is needed. Leave off if your
183: #   # chosen docker_image expects to start as root.
184: #   docker_run_as_host_user: true
185: #   # Optional: explicitly forward selected env vars into Docker.
186: #   # These values come from your current shell first, then ~/.hermes/.env.
187: #   # Warning: anything forwarded here is visible to commands run in the container.
188: #   docker_forward_env:
189: [CREDENTIAL-RELATED LINE OMITTED]
190: [CREDENTIAL-RELATED LINE OMITTED]
191: #   # Optional: extra flags passed verbatim to docker run (appended after security defaults).
192: #   # Useful for adding capabilities (e.g. apt installs needing SETUID) or custom options.
193: #   # Example: add a Linux capability not included by default
194: #   # docker_extra_args:
195: #   #   - "--cap-add"
196: #   #   - "SETUID"
