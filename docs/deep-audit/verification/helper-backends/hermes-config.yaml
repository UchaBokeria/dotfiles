1119: # =============================================================================
1120: # Platform Toolsets (per-platform tool configuration)
1121: # =============================================================================
1122: # Override which toolsets are available on each platform.
1123: # If a platform isn't listed here, its built-in default is used.
1124: #
1125: # You can use EITHER:
1126: #   - A preset like "hermes-cli" or "hermes-telegram" (curated tool set)
1127: #   - A list of individual toolsets to compose your own (see list below)
1128: #
1129: # Supported platform keys: cli, telegram, discord, whatsapp, slack, qqbot, teams, google_chat
1130: #
1131: # Examples:
1132: #
1133: #   # Use presets (same as defaults):
1134: #   platform_toolsets:
1135: #     cli: [hermes-cli]
1136: #     telegram: [hermes-telegram]
1137: #
1138: #   # Custom: give Telegram only web + terminal + file + planning:
1139: #   platform_toolsets:
1140: #     telegram: [web, terminal, file, todo]
1141: #
1142: #   # Custom: CLI without browser or image gen:
1143: #   platform_toolsets:
1144: #     cli: [web, terminal, file, skills, todo, tts, cronjob]
1145: #
1146: #   # Restrictive: Discord gets read-only tools only:
1147: #   platform_toolsets:
1148: #     discord: [web, vision, skills, todo]
1149: #
1150: # If not set, defaults are:
1151: #   cli:           hermes-cli            (everything + cronjob management)
1152: #   telegram:      hermes-telegram       (terminal, file, web, vision, image, tts, browser, skills, todo, cronjob, messaging)
1153: #   discord:       hermes-discord        (same as telegram)
1154: #   whatsapp:      hermes-whatsapp       (same as telegram)
1155: #   slack:         hermes-slack          (same as telegram)
1156: #   signal:        hermes-signal         (same as telegram)
1157: #   qqbot:            hermes-qqbot            (same as telegram)
1158: #   teams:            hermes-teams            (same as telegram)
1159: #   google_chat:      hermes-google_chat      (same as telegram)
1160: #
1161: platform_toolsets:
1162:   cli: [a2a, browser, clarify, code_execution, computer_use, connections, cronjob, delegation, file, image_gen, kanban, memory, session_search, skills, stt, terminal, todo, tts, vision, web]
