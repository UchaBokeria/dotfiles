329: # =============================================================================
330: # Tool Loop Guardrails
331: # =============================================================================
332: # Soft warnings are enabled by default. They append guidance to repeated failed
333: # or non-progressing tool results but still let the tool execute. Hard stops stay
334: # opt-in for interactive CLI/TUI/Desktop/ACP sessions, but default on for unattended
335: # gateway/cron sessions where nobody is present to interrupt a model that
336: # ignores loop warnings.
337:   use_real_profile: true
338: tool_loop_guardrails:
339:   warnings_enabled: true
340:   hard_stop_enabled: false
341:   non_interactive_hard_stop_enabled: true
342:   warn_after:
343:     exact_failure: 2
344:     same_tool_failure: 3
345:     idempotent_no_progress: 2
346:   hard_stop_after:
347:     exact_failure: 5
348:     same_tool_failure: 8
349:     idempotent_no_progress: 5
350: 
351: # =============================================================================
352: # Context Compression (Auto-shrinks long conversations)
353: # =============================================================================
354: # When conversation approaches model's context limit, middle turns are
355: # automatically summarized to free up space while preserving important context.
356: #
357: # HOW IT WORKS:
358: [CREDENTIAL-RELATED LINE OMITTED]
359: [CREDENTIAL-RELATED LINE OMITTED]
360: # 3. Protects first 3 turns (system prompt, initial request, first response)
361: # 4. Protects last N turns (default 20 messages = ~10 full turns of recent context)
362: # 5. Summarizes middle turns using a fast/cheap model
363: # 6. Inserts summary as a user message, continues conversation seamlessly
364: #
365: # Post-compression tail budget is target_ratio × threshold × context_length:
366: [CREDENTIAL-RELATED LINE OMITTED]
367: [CREDENTIAL-RELATED LINE OMITTED]
368: #
369: compression:
370:   # Enable automatic context compression (default: true)
371:   # Set to false if you prefer to manage context manually or want errors on overflow
372:   enabled: true
373: 
374:   # Fail closed before lossy compaction unless an active memory provider that
375:   # implements the pre-compress checkpoint contract (API v2) confirms its
376:   # durable checkpoint (default: false). With this on and no checkpoint, the
377:   # compaction attempt errors with BLOCKED_MISSING_PREREQUISITE and the
378:   # uncompressed transcript is preserved for a later retry. The gate binds to
379:   # every compaction authority: server-side native compaction
380:   # (codex_responses_native) is suppressed while armed, post-turn
381:   # micro-compaction is forced off (no checkpoint hook in its path), and the
382:   # codex_app_server API mode is refused at agent init (the codex agent
383:   # compacts its own thread — no checkpoint can be guaranteed there). Only
384:   # enable it with a checkpoint-capable provider configured — see
385:   # website/docs/developer-guide/memory-provider-plugin.md
386:   # ("Pre-Compress Checkpoints").
387:   checkpoint_required: false
388: 
389:   # Opt-in compression progress notices on chat platforms (default: false).
390:   # By design, routine automatic compression is SILENT on human-facing chat
391:   # gateways (Telegram, Discord, Slack, ...) — it happens in the background
392:   # with server-side logging only. Set true to also deliver the routine
393:   # progress statuses (compacting started, preflight/pre-API compression,
394:   # idle compaction, retry progress, and the compaction-complete notice) to
395:   # chat platforms. Unrelated operational noise (auxiliary model failures,
396:   # provider retry chatter) stays suppressed either way, and compression
397:   # FAILURE notices + manual /compress feedback are always visible
398:   # regardless of this setting. (#52995)
399:   progress_notices: false
400: 
401:   # Trigger compression at this % of model's context limit (default: 0.50 = 50%)
402:   # Lower values = more aggressive compression, higher values = compress later
403:   # Models with context windows below 512K are floored at 0.75 (raise-only) so
404:   # compaction doesn't fire with half the window still free; set above 0.75 to override.
405:   threshold: 0.50
406: 
407:   # Per-model threshold overrides: keys are substring-matched against the model
408:   # name (longest match wins). Useful when some models need different compaction
409:   # points — e.g. a 1M-context model can compress later (0.30) while a 128K
410:   # model needs to compress earlier (0.60). The small-context floor (75% for
411:   # <512K models) still applies on top of per-model overrides.
412:   # model_thresholds:
413:   #   "glm-5.2": 0.40
414:   #   "claude-sonnet": 0.35
415:   #   "gpt-5": 0.30
416: 
417: [CREDENTIAL-RELATED LINE OMITTED]
418:   # When set, compression fires at the LOWER of the ratio-based threshold and this
419: [CREDENTIAL-RELATED LINE OMITTED]
420:   # cap above the window is a no-op. Survives model switches and fallback activations.
421: [CREDENTIAL-RELATED LINE OMITTED]
422: 
423:   # Existing Codex gpt-5.5 behavior: raise Hermes' compaction trigger to 85%
424: [CREDENTIAL-RELATED LINE OMITTED]
425:   codex_gpt55_autoraise: true
426: 
427:   # Fraction of the threshold to preserve as recent tail (default: 0.20 = 20%)
428:   # e.g. 20% of 50% threshold = 10% of total context kept as recent messages.
429: [CREDENTIAL-RELATED LINE OMITTED]
430:   # Range: 0.10 - 0.80
431:   target_ratio: 0.20
432: 
433:   # Number of most-recent messages to always preserve (default: 20 ≈ 10 full turns)
434:   # Higher values keep more recent conversation intact at the cost of more aggressive
435:   # compression of older turns.
436:   protect_last_n: 20
437: 
438:   # Minimum number of REAL (actionable) user messages guaranteed to survive in
439:   # the uncompressed tail (default: 1 = the existing single last-user anchor,
440:   # behavior-preserving). Raise to e.g. 3 to keep the last 3 real user turns
441: [CREDENTIAL-RELATED LINE OMITTED]
442:   # platform echoes, compaction handoffs, and synthetic continuation rows never
443: [CREDENTIAL-RELATED LINE OMITTED]
444:   # cut back; the guarantee wins over the budget by design.
445:   min_tail_user_messages: 1
446: 
447:   # Compression retry rounds before a turn gives up with "max compression
448:   # attempts reached" (default: 3, same as the previous hardcoded value).
449:   # Raise (e.g. 6) for tool-schema-heavy sessions where 3 rounds cannot bring
450:   # the request estimate under the threshold. Validated >= 1, hard cap 10.
451:   max_attempts: 3
452: 
453:   # Codex app-server (codex CLI runtime) thread-compaction mode. The codex
454:   # agent owns the real thread context on this runtime, so Hermes' summarizer
455:   # cannot shrink it — compaction goes through the app server instead.
456:   #   native = let Codex decide when to compact its own thread (default)
457:   #   hermes = let Hermes threshold trigger Codex thread/compact/start
458:   #   off    = Hermes will not auto-trigger compaction; Codex may still compact natively
459:   codex_app_server_auto: native
460: 
461:   # Native OpenAI Responses server-side compaction (default: false). When true,
462:   # gpt-5.6-family models on the DIRECT OpenAI API (api.openai.com) or a ChatGPT
463: [CREDENTIAL-RELATED LINE OMITTED]
464:   # server-side: OpenAI prunes older context into an
465:   # encrypted checkpoint that Hermes replays on later turns. No other provider,
466:   # route, or model is affected. Hermes' local compression stays armed as the
467:   # fallback and still handles every non-eligible session.
468:   codex_responses_native: false
469: 
470: [CREDENTIAL-RELATED LINE OMITTED]
471: [CREDENTIAL-RELATED LINE OMITTED]
472:   # safety margin. For example, a local trigger of 765000 selects 756808.
473:   # A positive integer stays absolute and only clamps downward when needed so
474:   # the server compacts first. Invalid values use this automatic behavior. If
475:   # the local trigger is unavailable, automatic mode uses 200000.
476:   codex_responses_compact_threshold:
477: 
478:   # Number of non-system messages to protect at the head of the transcript, in
479:   # ADDITION to the system prompt (which is always implicitly protected).
480:   # Head messages are NEVER summarized — they survive every compression
481:   # indefinitely. This gives stable early context for short/medium sessions,
482:   # but in long-running sessions that rely on rolling compaction the pinned
483:   # opening turns may not match how you want the session framed over time.
484:   # Set to 0 to preserve ONLY the system prompt (plus the rolling summary
485:   # and recent tail) — the cleanest configuration for long-running sessions.
486:   # Default 3 preserves the system prompt plus the first three non-system
487:   # head messages, matching the pre-feature behaviour.
488:   protect_first_n: 3
489: 
490:   # Idle compaction (default: 0 = disabled). When > 0, a session that resumes
491:   # after at least this many seconds of inactivity compacts its accumulated
492:   # history up front, before the first reply, so a long-lived thread you come
493:   # back to later doesn't re-read its full stale context on every turn.
494:   # Time-based, so it complements (does not replace) the size-based `threshold`
495:   # above. It is skipped when the context is already small (at or below the
496:   # post-compression target = threshold × target_ratio), so it never wastes a
497:   # summarization on a short idle thread. Example: 1800 = compact after 30 min idle.
498:   idle_compact_after_seconds: 0
499: 
500:   # Gateway session-hygiene turn-hold budget (default: 10). Max seconds an
501:   # arriving user turn is held while a still-streaming hygiene summary
502:   # finishes. Distinct from hygiene_timeout_seconds (compressor inactivity
503:   # budget): this bounds user-visible latency so chat transports (Telegram
504:   # ~30s) do not drop a silent connection. On expiry the turn proceeds
505:   # uncompressed; the detached worker keeps its commit admission (when the
506:   # commit is watermark-fenced) and the summary is adopted at the next safe
507:   # boundary. Thinking-model summarizers often need longer than 10s to emit
508: [CREDENTIAL-RELATED LINE OMITTED]
509:   # time-to-first-content) only if you want THIS turn to wait for the
510:   # compression instead of adopting it one turn late.
511:   hygiene_max_turn_hold_seconds: 10
512: 
513: [CREDENTIAL-RELATED LINE OMITTED]
514:   # for a deterministic, no-LLM prune of OLD tool-result payloads, run
515:   # independently of `threshold` above. On large-window models (512K/1M) the
516:   # ratio threshold rarely fires, so bulky tool outputs (terminal dumps, file
517:   # reads, web extracts) ride along in history and get re-billed every turn.
518: [CREDENTIAL-RELATED LINE OMITTED]
519:   # results, summarizes older oversized ones, and truncates large tool-call
520:   # arguments — protecting the most recent `protect_last_n` messages and never
