303: # Browser Tool Configuration
304: # =============================================================================
305: browser:
306:   # Inactivity timeout in seconds - browser sessions are automatically closed
307:   # after this period of no activity between agent loops (default: 120 = 2 minutes)
308:   inactivity_timeout: 120
309:   # Let an authenticated browser extension register as the controller for an
310:   # existing Hermes session. Disabled by default. Local API registration also
311: [CREDENTIAL-RELATED LINE OMITTED]
312:   extension_control:
313:     enabled: true
314: 
315:   # Maximum characters of snapshot content before truncate-and-store.
316:   # Increase for long pages (for example, documentation or financial reports),
317:   # or decrease to reduce context usage. Minimum: 1000; default: 15000
318:   # (same per-page budget as web_extract).
319:   # snapshot_threshold: 15000
320: 
321:   # JavaScript evaluation guardrails (both default false). restrict_evaluate
322:   # opts into a denylist that blocks sensitive primitives (cookies, storage,
323:   # clipboard, network, form values) in browser_console(expression=...) — use
324:   # it when the agent drives a logged-in profile. allow_unsafe_evaluate is the
325:   # legacy override that switches the denylist back off even when restrict is on.
326:   # restrict_evaluate: false
327:   # allow_unsafe_evaluate: false
