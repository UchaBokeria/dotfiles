748: # =============================================================================
749: # Session Storage Retention (state.db)
750: # =============================================================================
751: # ~/.hermes/state.db keeps every session, message, and tool call, plus the
752: # FTS5 search indexes. Since #54189, auto-pruning is ON by default so the file
753: # stays bounded: at CLI/gateway/cron startup (at most once per
754: # min_interval_hours) Hermes deletes ENDED sessions whose last activity is
755: # older than retention_days. Open, pinned, and in-progress sessions are never
756: # deleted. Stale automation sessions (cron/kanban/subagent/one-shot CLI) whose
757: # process died without closing them are first *closed*, then aged through a
758: # further full retention window before removal.
759: #
760: # After a prune that removed rows, VACUUM reclaims disk space only when both
761: # the time throttle (min_vacuum_interval_days) has elapsed AND more than 25%
762: # of the file's pages are reclaimable — a dense database never pays for a full
763: # rewrite to reclaim a few MB.
764: #
765: # Uncomment to change the defaults shown; set auto_prune: false to keep every
766: # ended session forever (the pre-#54189 behavior).
767: # sessions:
768: #   auto_prune: true
769: #   retention_days: 90
770: #   vacuum_after_prune: true
771: #   min_vacuum_interval_days: 30
772: #   min_interval_hours: 24
773: 
