1297: # =============================================================================
1298: # MCP (Model Context Protocol) Servers
1299: # =============================================================================
1300: # Connect to external MCP servers to add tools from the MCP ecosystem.
1301: # Each server's tools are automatically discovered and registered.
1302: # See website/docs/user-guide/features/mcp.md for full documentation.
1303: #
1304: # Stdio servers (spawn a subprocess):
1305: #   command: the executable to run
1306: #   args: command-line arguments
1307: #   env: environment variables (only these + safe defaults passed to subprocess)
1308: #
1309: # HTTP servers (connect to a URL):
1310: #   url: the MCP server endpoint
1311: #   headers: HTTP headers (e.g., for authentication)
1312: #
1313: # Optional per-server settings:
1314: #   timeout: tool call timeout in seconds (default: 120)
1315: #   connect_timeout: initial connection timeout (default: 60)
1316: #   keepalive_interval: liveness ping cadence in seconds (floored at 5s).
1317: #     HTTP servers default to 180s; lower it below the server's session TTL for
1318: #     servers that expire idle sessions quickly (e.g. Unreal Engine editor MCP,
1319: #     ~15s), otherwise idle tool calls hit an expired session and pay a slow
1320: #     reconnect. Stdio servers disable keepalive by default; set this explicitly
1321: #     to opt a stdio server in.
1322: #   lazy: register the server's tools from the on-disk schema cache at startup
1323: #     and only spawn/connect it on the first tool call (default: false). Saves
1324: #     one child process per server in processes that rarely call tools. Needs
1325: #     one prior live connect to populate the cache; a missing or stale cache
1326: #     entry falls back to the normal eager connect. The banner and the TUI show
1327: #     such a server as "lazy" with its cached tool count until it is first used.
1328: #
1329: # mcp_servers:
1330: #   time:
1331: #     command: uvx
1332: #     args: ["mcp-server-time"]
1333: #   filesystem:
1334: #     command: npx
1335: #     args: ["-y", "@modelcontextprotocol/server-filesystem", "/home/user"]
1336: #   notion:
1337: #     url: https://mcp.notion.com/mcp
1338: #   github:
1339: #     command: npx
1340: #     args: ["-y", "@modelcontextprotocol/server-github"]
1341: #     env:
1342: [CREDENTIAL-RELATED LINE OMITTED]
1343: #
1344: # Sampling (server-initiated LLM requests) — enabled by default.
1345: # Per-server config under the 'sampling' key:
1346: #   analysis:
1347: #     command: npx
1348: #     args: ["-y", "analysis-server"]
1349: #     sampling:
1350: #       enabled: true           # default: true
1351: #       model: "gemini-3-flash" # override model (optional)
1352: [CREDENTIAL-RELATED LINE OMITTED]
1353: #       timeout: 30             # LLM call timeout (seconds)
1354: #       max_rpm: 10             # max requests per minute
1355: #       allowed_models: []      # model whitelist (empty = all)
1356: #       max_tool_rounds: 5      # tool loop limit (0 = disable)
1357: #       expose_client_tools: false # advertise extended sampling.tools capability
1358: #       log_level: "info"       # audit verbosity
1359: 
