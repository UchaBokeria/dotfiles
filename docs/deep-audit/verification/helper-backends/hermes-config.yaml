1839: # Valid events (mirror hermes_cli.plugins.VALID_HOOKS):
1840: #   pre_tool_call, post_tool_call, pre_llm_call, post_llm_call,
1841: #   pre_api_request, post_api_request, on_session_start, on_session_end,
1842: #   on_session_finalize, on_session_reset, subagent_stop
1843: #
1844: # First-use consent: each (event, command) pair prompts once on a TTY, then
1845: # is persisted to ~/.hermes/shell-hooks-allowlist.json.  Non-interactive
1846: # runs (gateway, cron) need --accept-hooks, HERMES_ACCEPT_HOOKS=1, or the
1847: # hooks_auto_accept key below.
