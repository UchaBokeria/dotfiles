1361: # Text-to-Speech
1362: # =============================================================================
1363: # TTS defaults to Edge TTS unless changed in ~/.hermes/config.yaml.
1364: # Gemini TTS supports persona/director prompt files, and Gemini 3.1 Flash TTS
1365: [CREDENTIAL-RELATED LINE OMITTED]
1366: # audio tags into the TTS script without showing tags in chat.
1367: #
1368: # tts:
1369: #   provider: "gemini"
1370: #   speed: 1.0              # global speed multiplier (provider-specific overrides this)
1371: #   # Per-platform audio upload limits. Built-in defaults: discord 10 MiB,
1372: #   # telegram 50 MiB, everything else 10 MiB, each with safety_ratio 0.85
1373: #   # (the fraction of max_file_bytes actually targeted). Override per platform:
1374: #   delivery_profiles:
1375: #     telegram:
1376: #       max_file_bytes: 52428800
1377: #       safety_ratio: 0.85
1378: #   gemini:
1379: #     model: "gemini-3.1-flash-tts-preview"
1380: #     voice: "Kore"
1381: #     audio_tags: false
1382: #     persona_prompt_file: ""  # e.g. ~/.hermes/tts/radio-host.md
1383: #   xai:
1384: #     voice_id: "eve"       # built-in or custom voice ID from xAI Console
1385: #     language: "en"        # BCP-47 code ("en", "pt-BR") or "auto"
1386: #     speed: 1.0            # 0.7-1.5 playback speed
1387: #     auto_speech_tags: false  # insert expressive audio tags via LLM rewrite
1388: #     text_normalization: false  # normalize numbers/abbreviations/symbols
1389: #     optimize_streaming_latency: 0  # 0-2, trades quality for lower latency
1390: #     sample_rate: 24000    # 22050 / 24000 / 44100 / 48000
1391: #     bit_rate: 128000      # MP3 bitrate (codec=mp3 only)
