821: # gateway/assets/ ships status_phrases.yaml and the Telegram BotFather
822: # screenshot. Without this, sealed venvs (uv2nix) silently lose both —
823: # status phrases fall back to the tiny hardcoded set and the Telegram
824: # topic-setup image disappears. Loaded via Path(__file__).parent / "assets"
825: # in gateway/status_phrases.py and gateway/run.py.
826: gateway = ["assets/**/*"]
827: # Bundled plugin discovery reads these manifests at runtime. Keep them in
828: # sealed wheels with the plugin Python modules; without this declaration the
829: # wheel contains adapters but discovery finds zero bundled plugins.
830: plugins = ["**/plugin.yaml", "**/plugin.yml"]
831: # pm/lock.json is the runtime pin table (uv/python/tool versions + sha256s).
832: # Without it a sealed wheel installs the pm package but has no pins to
833: # realize — the pm store would be empty.
834: pm = ["lock.json", "artifact-mirror.json", "pyproject.toml", "uv.lock"]
835: # Bot Desktop starts Xvnc + Xfce through a shell launcher and seeds the wallpaper; both are read
836: # via Path(__file__).parent in tools/bot_desktop/runtime.py and vanish from sealed wheels otherwise.
837: tools = ["bot_desktop/launcher.sh", "bot_desktop/wallpaper.png"]
