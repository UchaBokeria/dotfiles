865: [tool.ruff.lint]
866: # All other lints are intentionally disabled (see comment history on this
867: # file) while we wrangle typechecks — but PLW1514 is too load-bearing to
868: # keep off.  Bare open()/read_text()/write_text() in text mode defaults to
869: # the system locale encoding on Windows (cp1252 on US-locale installs),
870: # which silently corrupts any non-ASCII file content.  We had three
871: # separate Windows sandbox regressions in one debug session before
872: # adding the explicit encoding.  This rule keeps new code honest.
873: #
874: # ASYNC210/220/221/251: blocking calls inside `async def` freeze the whole
875: # gateway/uvicorn event loop — every adapter, timer, and health check stops
876: # until the call returns.  Real incidents: a 17-minute getaddrinfo hang took
877: # the backend down (#91912); `time.sleep` in start_gateway froze restarts
878: # for 10s (#36163).  The fix pattern is `await asyncio.to_thread(...)` (or
879: # `loop.run_in_executor`), `asyncio.create_subprocess_exec`, and
880: # `await asyncio.sleep`.  These four are the direct freeze vectors:
881: #   ASYNC210 — blocking HTTP call in async fn (urllib/requests/httpx-sync)
882: #   ASYNC220 — subprocess.Popen in async fn
883: #   ASYNC221 — subprocess.run / os.system in async fn
884: #   ASYNC251 — time.sleep in async fn
885: # ASYNC230 (blocking open()) and ASYNC240 (blocking path methods) are real
886: # but ~180 legacy sites deep; they graduate to this list once the backlog
887: # is burned down (see per-file-ignores below for the frozen baseline).
888: select = ["PLW1514", "ASYNC210", "ASYNC220", "ASYNC221", "ASYNC251", "TID251"]
889: 
890: [tool.ruff.lint.flake8-tidy-imports.banned-api]
891: "pm.uv".msg = "Use PM's semantic Python operations, not an installer executable."
892: "pm.client.uv".msg = "Use PM's semantic Python operations."
893: "pm.install.uv".msg = "The raw uv bridge was removed; use PM operations."
894: "pm._uv".msg = "Tool acquisition is private to PM."
895: "pm.environment".msg = "The environment engine is private; use PM operations."
896: "pm.runtime_stage".msg = "PM stages its own worker runtime; consumers call pm operations."
897: 
898: [tool.ruff.lint.per-file-ignores]
899: "pm/**" = ["TID251"]
900: # Desktop E2E fixtures stand in for PM's worker/runtime and reach into it like tests do.
901: "apps/desktop/electron/fixtures/**" = ["TID251"]
902: # Tests can intentionally exercise locale-encoding edge cases.
903: "tests/**" = [
904:   "PLW1514",
905:   "ASYNC210",
906:   "ASYNC220",
907:   "ASYNC221",
908:   "ASYNC251",
909:   "TID251",
910: ]
911: # Skills and plugins are partially user-authored — their own conventions.
912: "skills/**" = ["PLW1514"]
913: "optional-skills/**" = ["PLW1514"]
914: # Plugin platform adapters run ON the gateway event loop — the ASYNC gate
915: # applies to them with full force; only PLW1514 stays relaxed.
916: "plugins/**" = ["PLW1514"]
