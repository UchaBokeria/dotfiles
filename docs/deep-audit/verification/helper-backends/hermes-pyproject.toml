562: [tool.hermes]
563: # Extras that only an explicit selection installs (setup, sync_venv). Bundles
564: [CREDENTIAL-RELATED LINE OMITTED]
565: # closures never ship. KittenTTS pulls torch, transformers and spaCy through
566: # misaki[en]: installed when the user picks it, not preinstalled.
567: opt-in-extras = ["kittentts"]
568: 
569: # Per-extra platform gates (settled 2026-09-02): an extra listed here is
570: # only installable on platforms matching the marker. pm consults this
571: # table (pm.extras.extra_supported) — ensure_import/sync_venv refuse a
572: # gated-off extra with a clear message instead of resolving it to an
573: # empty set. The per-package markers inside the extra stay (uv's
574: # resolver needs them for --all-extras); this table is the readable
575: # single-authority for WHICH extra is supported WHERE.
576: 
577: [tool.hermes.extras-platforms]
578: # mautrix[encryption] → python-olm: linux-only wheels, no win/darwin build.
579: matrix = "sys_platform == 'linux'"
580: # grpcio (via google-cloud-pubsub) has no win_arm64 wheel.
581: google-chat = "platform_machine != 'ARM64' or sys_platform != 'win32'"
582: # Match the engine dependency markers so PM refuses an unsupported install.
583: wake-openwakeword = "(platform_machine != 'ARM64' or sys_platform != 'win32') and (platform_machine != 'x86_64' or sys_platform != 'darwin')"
584: # faster-whisper's closure is prebuilt-only: ctranslate2 has no win_arm64 wheel and onnxruntime
585: # none for darwin-x64. Its ANCHOR is faster_whisper, so an unsupported machine could install the
586: # extra, rebuild the whole dependency environment and still fail the anchor on every retry.
587: # Gate the extra that carries only faster-whisper; [voice] also has ungated deps (sounddevice,
588: # numpy) and stays installable, see test_declared_extra_gates_match_dependency_selection.
589: stt-whisper = "(platform_machine != 'ARM64' or sys_platform != 'win32') and (platform_machine != 'x86_64' or platform_system != 'Darwin')"
590: # NeuTTS excludes Python 3.14.
591: neutts = "python_version < '3.14'"
592: # KittenTTS: onnxruntime has no Intel macOS wheel; misaki[en]'s torch has no
593: # Windows ARM64 wheel.
594: kittentts = "(platform_machine != 'ARM64' or sys_platform != 'win32') and (platform_machine != 'x86_64' or sys_platform != 'darwin')"
595: piper = "(platform_machine != 'ARM64' or sys_platform != 'win32') and (platform_machine != 'x86_64' or sys_platform != 'darwin')"
596: 
597: [tool.uv]
598: # uv otherwise enables the dev group by default, including in payload builds.
599: default-groups = []
600: # 3.11 is an install bridge for pre-PM updaters, never a runtime, so the lock
601: # covers 3.14 only. Without this the lock must resolve every supported version,
602: # where extras that only ever coexist on 3.14 (kittentts vs neutts) conflict.
603: environments = ["python_version >= '3.14'"]
604: override-dependencies = [
605:   # discord.py's latest published version, 2.7.1, pins pynacl at <1.6. however, pynacl 1.5.0 has known vulnerabilities.
606:   # discord.py has updated pynacl to 1.6 on `main`, but has not yet published a patch release.
607:   # so, we force-override this to pynacl 1.6. here.
608:   # remove this when we update discord.py
609:   "pynacl>=1.6,<1.7",
610:   # alibabacloud-tea-openapi caps cryptography<49, and its latest release
611:   # still does. Without this override, that cap holds cryptography at 48.0.1
612:   # and its three advisories (see the cryptography pin in
613:   # [project].dependencies). The package uses cryptography only to sign
614:   # requests with RSA and AES, and that API did not break in 49 or 50.
615:   # Keep this exact version equal to the direct dependency. uv overrides
616:   # replace that requirement too, not only the vendor's upper bound.
617:   # Remove this line when alibabacloud-tea-openapi lifts the cap.
618:   "cryptography==50.0.1",
619:   # misaki[en] (pulled by [kittentts]) lists spacy-curated-transformers.
620:   # The newest release that fits spacy 3.8 (2.x needs thinc 9), 0.3.1, caps
621:   # Python below 3.14, so PM's `uv pip check` rejects the venv. Nothing
622:   # imports it: only transformer spaCy models (trf=True) do, and KittenTTS
623:   # never builds a misaki G2P. The never-true marker removes it from the lock.
624:   # Remove this line when misaki drops it or a 3.14-capable release fits.
625:   "spacy-curated-transformers; sys_platform == 'never'",
626: ]
627: exclude-newer = "14 days"
628: # h2: temporary exclude-newer exception for the CVE-2026-71554 (GHSA-6hr6-w5qg-qmwg,
629: # request-smuggling) fix in 4.4.1, published 2026-08-03. Remove after 2026-08-17.
630: # aiohttp, cryptography: same shape — the advisory fixes are newer than the
631: # 14-day window, so the resolver cannot see them without an exception.
632: #
633: # defusedxml, python-olm, unpaddedbase64: the OPPOSITE shape (#80387, #79434,
634: # #78227 family). These are ancient, effectively frozen releases (2021-2023)
635: # whose upload dates are frequently absent from mirror indexes and stale uv
636: # HTTP caches. uv treats a missing upload date as "newer than the cutoff" and
637: # excludes the package, bricking [youtube]/[wecom]/[matrix] resolution
638: # ("there are no versions of defusedxml"). Exempting them carries zero aging
639: # risk — their newest releases are years old — and unbricks resolvers that
640: # cannot see upload dates.
641: #
642: # setuptools, wheel, pillow, mcp: build/core pin bricks (#78227, #75992, #76020, #96488). uv
643: # applies exclude-newer to build-system.requires and core deps too; when a
644: # resolver cannot see an upload date (old uv, mirror index, stale HTTP cache)
645: # it filters the pinned version and the package cannot even BUILD
646: # ("No solution found when resolving: setuptools==83.0.0"). These deps are
647: # exact-pinned (==X.Y.Z), so exclude-newer adds zero float protection for
648: # them — the version cannot move without a reviewed pin bump — while the
649: # cutoff can still brick installs. Exempting exact pins is pure brick-risk
650: # removal at no supply-chain cost. Guarded by
651: # tests/test_packaging_metadata.py::test_build_system_requires_exempt_from_exclude_newer.
652: #
653: # firecrawl-anydoc: same exact-pin shape (==0.2.4, hosted-OCR wiring PR).
654: # The pin bump WAS the review; exclude-newer adds zero float protection to
655: # an exact pin and would only delay the reviewed version 14 days.
656: #
657: # Every other exact-pinned package below: the release-day brick shape
658: # (observed 2026-08-29 updating three long-running installs v0.20.0 ->
659: # v0.20.6 — one Termux, two Linux servers). Each release exact-pins at least
660: # one dependency to a version published days before the release (v0.20.6
661: # pinned snowballstemmer==3.1.1 and psutil==7.2.2 in core, plus fastapi /
662: # uvicorn / python-telegram-bot pins across extras). For two weeks after
663: # release the cutoff filters those versions out, so any venv that predates
664: # the release bricks on `hermes update` ("no version of
665: # snowballstemmer==3.1.1") until the window passes. Same zero-float-
666: # protection logic as setuptools/pillow/mcp above; enforced for every exact
667: # pin by
668: # tests/test_packaging_metadata.py::test_exact_pinned_deps_exempt_from_exclude_newer.
669: #
670: # maturin, setuptools-rust: build-system.requires of the cryptography pin
671: # above. cryptography itself is exempted, but on wheel-less platforms
672: # (Termux/Android) it must build from sdist, and the isolated build
673: # environment resolves under the same cutoff ("Failed to resolve
674: # requirements from build-system.requires ... maturin>=1.9,<2").
675: #
676: # google-cloud-pubsub: same exact-pin shape (==2.39.2, google-chat adapter).
677: # The pin bump WAS the review; exclude-newer only filters it because the
678: # 14-day window is younger than the reviewed release.
679: 
