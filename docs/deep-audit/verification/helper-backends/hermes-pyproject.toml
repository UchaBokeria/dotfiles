5: [project]
6: name = "hermes-agent"
7: version = "0.0.0"
8: description = "The self-improving AI agent — creates skills from experience, improves them during use, and runs anywhere"
9: readme = "README.md"
10: # 3.14 is the newest python we know we have wheels for.
11: # we *only* support 3.14, BUT we need to allow old hermes installs on <3.14
12: # to get thru their update step on old python.
13: # Shortly after they do, we update to our latest python.
14: # See tests/compat/README.md for the updater contract this keeps.
15: requires-python = ">=3.11,<3.15"
16: authors = [{ name = "Nous Research" }]
17: license = "MIT"
18: license-files = ["LICENSE"]
19: dependencies = [
20:   # Core — every direct dep is exact-pinned to ==X.Y.Z (no ranges).
21:   # Rationale: ranges allow PyPI to ship a fresh version of a transitive
22:   # at any time without a code review on our side. Exact pins mean the
23:   # only way a new package version reaches a user is via an intentional
24:   # update on our end (bump the pin in this file, regenerate uv.lock).
25:   # This was tightened on 2026-05-12 in response to the Mini Shai-Hulud
26:   # worm hitting mistralai 2.4.6 on PyPI; if that release had been
27:   # captured by `mistralai>=2.3.0,<3` rather than an exact pin, every
28:   # install in the hours before the quarantine would have pulled it.
29:   #
30:   # After a pin change, run `hermes pm lock` so the transitive resolution
31:   # stays consistent. Do not introduce ranges
32:   # without a written justification.
33:   #
34:   # Scope rule: only packages used by EVERY hermes session belong here.
35:   # Anything that's provider-specific (`anthropic`, `firecrawl-py`,
36:   # `exa-py`, `fal-client`, `edge-tts`, `parallel-web`) belongs in an
37:   # extra and gets prepared through PM when the
38:   # user picks that backend. Smaller `dependencies` = smaller blast
39:   # radius for the next supply-chain attack.
40:   "openai==2.24.0; python_version >= '3.14'",
41:   "certifi==2026.5.20; python_version >= '3.14'",
42:   # TLS trust comes from the OS certificate store (agent/ssl_verify.py), so
43:   # a corporate/internal root installed on the machine just works. certifi
44:   # above stays a direct pin because httpx/requests/openai each depend on
45:   # it regardless; it is no longer OUR trust source.
46:   # ssl_verify uses truststore's private original SSLContext for explicit CA overrides.
47:   # Keep this exact until that path has a public-API replacement.
48:   "truststore==0.10.4; python_version >= '3.14'",
49:   "python-dotenv==1.2.2; python_version >= '3.14'",
50:   "fire==0.7.1; python_version >= '3.14'",
51:   "httpx[socks]==0.28.1; python_version >= '3.14'",
52:   "rich==14.3.3; python_version >= '3.14'",
53:   "tenacity==9.1.4; python_version >= '3.14'",
54:   "tomli-w==1.2.0; python_version >= '3.14'",  # Preserve relative dependency paths in staged plugin metadata.
55:   # 0.18.17 requires ruamel.yaml.clib on 3.14, which has no Windows ARM64 wheel.
56:   "ruamel.yaml==0.18.16; python_version >= '3.14'",
57:   "requests==2.33.0; python_version >= '3.14'",  # CVE-2026-25645
58:   "jinja2==3.1.6; python_version >= '3.14'",
59:   # Document-to-Markdown extraction for read_file (PDF, legacy Office,
60:   # OpenDocument, RTF, EPUB) + typed NeedsOcrError for scanned pages.
61:   # Bundled in core by maintainer decision (read_file is a core tool and
62:   # PDF reads are a common first-session action; the previous lazy-only
63:   # arrangement dated to the package's uv exclude-newer quarantine, which
64:   # has long expired). PM's doc-extract extra repairs lean/broken installs
65:   # from this same dependency declaration.
66:   "firecrawl-anydoc==0.2.4; python_version >= '3.14'",
67:   # Bumped from 2.12.5 to 2.13.4 to pull in pydantic-core 2.46.4.
68:   # pydantic-core 2.41.5 (pulled by 2.12.5) segfaults when the OpenAI SDK's
69:   # Responses API resource is exercised from a non-main thread, which is the
70:   # codex_responses dispatch in agent/chat_completion_helpers.py:_call.
71:   "pydantic==2.13.4; python_version >= '3.14'",
72:   # Interactive CLI (prompt_toolkit is used directly by cli.py)
73:   "prompt_toolkit==3.0.52; python_version >= '3.14'",
74:   # Cron scheduler (built-in feature — scheduled cron/interval jobs use croniter).
75:   "croniter==6.0.0; python_version >= '3.14'",
76:   # Snowball stemming for tool_search's BM25 (tools/tool_search.py) —
77:   # official Snowball project package, pure Python, zero transitive deps.
78:   # Applied at index AND query time so morphological variants match
79:   # ("issues" finds create_issue).
80:   "snowballstemmer==3.1.1; python_version >= '3.14'",
81:   # Requirement and version checks must work in lean installs without
82:   # relying on another package to bring packaging in transitively.
83:   "packaging==26.0; python_version >= '3.14'",
84:   # Markdown -> HTML conversion for rich message delivery (Matrix
85:   # `formatted_body`, and the `send_message` tool's HTML path). Now on the
86:   # DEFAULT delivery path, not matrix-specific: without it both
87:   # gateway/platforms/matrix.py and tools/send_message_tool.py silently fall
88:   # back to plain text, so cron/agent deliveries render raw `##`/`**`/tables
89:   # in clients like Element (see #32486). Pure-Python py3-none-any wheel
90:   # (~108KB, no compiled extensions, no platform constraints), so unlike the
91:   # matrix extra's `mautrix`/`python-olm` it's safe to ship everywhere — keeps
92:   # it out of the lazy-install path that exists only for the heavy matrix deps.
93:   "Markdown==3.10.2; python_version >= '3.14'",
94:   # Skills Hub (GitHub App JWT auth — optional, only needed for bot identity)
95:   "PyJWT[crypto]==2.13.0; python_version >= '3.14'",  # PYSEC-2026-175/177/178/179
96:   # urllib3 2.7.0 fixes GHSA-mf9v-mfxr-j63j (decompression-bomb bypass)
97:   # and GHSA-qccp-gfcp-xxvc (header leak across origins).
98:   "urllib3>=2.7.0,<3; python_version >= '3.14'",
99:   # PyJWT[crypto] pulls cryptography in transitively. Pin it here as well, so
100:   # that the WeCom and Weixin crypto paths cannot fall below the patched
101:   # version. 50.0.0 is the floor: it fixes CVE-2026-69247, a Bleichenbacher
102:   # oracle in PKCS#7 EnvelopedData, and 49.0.0 fixed GHSA-m2h6-j472-rp4c,
103:   # where a wildcard DNS name escapes permittedSubtrees, and
104:   # GHSA-jwv3-5hgf-82ww, exponential path-building on duplicate self-signed
105:   # intermediates.
106:   #
107:   # A pin here is not sufficient on its own. alibabacloud-tea-openapi caps
108:   # cryptography<49, so [tool.uv] also holds an override. Read that comment
109:   # before you move this version.
110:   "cryptography==50.0.1; python_version >= '3.14'",  # CVE-2026-69247, GHSA-m2h6-j472-rp4c, GHSA-jwv3-5hgf-82ww, CVE-2026-39892, CVE-2026-34073, GHSA-537c-gmf6-5ccf
111:   # Windows has no IANA tzdata shipped with the OS, so Python's ``zoneinfo``
112:   # (PEP 615) raises ``ZoneInfoNotFoundError`` for every non-UTC timezone
113:   # out of the box.  ``tzdata`` ships the Olson database as a data package
114:   # Python resolves automatically.  No-op on Linux/macOS (which have
115:   # /usr/share/zoneinfo).  Credits: PR #13182 (@sprmn24).
116:   "tzdata==2025.3; sys_platform == 'win32' and python_version >= '3.14'",
117:   # Cross-platform process / PID management.  `psutil` is the canonical
118:   # answer for "is this PID alive" and process-tree walking across Linux,
119:   # macOS and Windows.  It replaces POSIX-only idioms like `os.kill(pid, 0)`
120:   # (which is a silent killer on Windows — see CONTRIBUTING.md) and
121:   # `os.killpg` (which doesn't exist on Windows).
122:   "psutil==7.2.2; sys_platform != 'android' and python_version >= '3.14'",
123:   # Android Python 3.13+ needs upstream #2891 for platform recognition and
124:   # disk_partitions(). The fix is not in a published psutil release yet.
125:   # Keep this commit until a release includes it, then remove the source pin.
126:   "psutil @ git+https://github.com/giampaolo/psutil.git@380bd2b59c67b0e1b04bbf3a90b11744f4f96644 ; sys_platform == 'android' and python_version >= '3.14'",
127:   # Browser CDP supervisor + browser_dialog import this directly. Keep core
128:   # so browser tool discovery doesn't fail on lean installs.
129:   "websockets==15.0.1; python_version >= '3.14'",
130:   # Engine of the default browser_exec tool (the `browser-use` CLI is a thin
131:   # wrapper over it). Pure Python, and its pins match Pillow/websockets above,
132:   # so it rides in the main venv and every install, Desktop bundle included,
133:   # ships it without a separate tool environment.
134:   "browser-harness==0.1.13; python_version >= '3.14'",
135:   # .gitignore-aware file matching for desktop build stamp.
136:   "pathspec==1.1.1; python_version >= '3.14'",
137:   "fastapi>=0.104.0,<1; python_version >= '3.14'",
138:   # CIDR-aware forwarded_allow_ips requires uvicorn >=0.31.0.
139:   # uvicorn's [standard] extra bundles uvloop, httptools, and watchfiles.
140:   # uvloop cannot build on Android/Termux (libuv's ./configure fails), so
141:   # we declare the working components inline and gate uvloop behind the
142:   # [uvloop] optional extra — desktop/server profiles pull it via [all].
143:   "uvicorn>=0.31.0,<1; python_version >= '3.14'",
144:   "httptools>=0.6.3,<0.9; python_version >= '3.14'",
145:   "watchfiles>=0.20,<2; python_version >= '3.14'",
146:   # Streaming multipart uploads for the dashboard file manager (NS-501).
147:   # FastAPI's UploadFile/Form depend on python-multipart; it is NOT pulled in
148:   # by fastapi itself, so the dashboard's multipart upload endpoint would 500
149:   # without an explicit dependency here (and in the `web` extra below).
150:   "python-multipart>=0.0.9,<1; python_version >= '3.14'",
151:   "ptyprocess>=0.7.0,<1; sys_platform != 'win32' and python_version >= '3.14'",
152:   # Python 3.14 requires pywinpty 3.x. Version 3.0.5 includes the native
153:   # binaries missing from 3.0.4 wheels on both Windows architectures.
154:   "pywinpty>=3.0.5,<4; sys_platform == 'win32' and python_version >= '3.14'",
155:   # Desktop SSH's Windows remote runtime (hermes_cli/windows_ssh_runtime.py)
156:   # imports win32security/win32file/etc. directly — declare pywin32 rather than
157:   # relying on the concurrent-log-handler → portalocker transitive chain.
158:   "pywin32>=306,<312; sys_platform == 'win32' and python_version >= '3.14'",
159:   # App Installer checks use Package from ApplicationModel. Foundation
160:   # supplies the URI and async result types projected when the checker runs.
161:   "winrt-windows-applicationmodel>=3.2.1,<4; sys_platform == 'win32' and python_version >= '3.14'",
162:   "winrt-windows-foundation>=3.2.1,<4; sys_platform == 'win32' and python_version >= '3.14'",
163:   # Store update queries and request results project collection interfaces.
164:   "winrt-windows-foundation-collections>=3.2.1,<4; sys_platform == 'win32' and python_version >= '3.14'",
165:   "winrt-windows-services-store>=3.2.1,<4; sys_platform == 'win32' and python_version >= '3.14'",
166:   # Image resize recovery for the vision tools. Pillow shrinks oversized images
167:   # (>5 MB or >8000px) at embed time; without it the byte AND pixel-dimension
168:   # shrink paths no-op, so an oversized image bakes into immutable history and
169:   # bricks the session on Anthropic's non-retryable 400. Pure-wheel, no system
170:   # libs required for the codecs we use, so it's safe to ship in the base
171:   # install rather than gating it behind an extra + a mid-session lazy install
172:   # (which deadlocked the CLI under prompt_toolkit — see #40490).
173:   "Pillow==12.3.0; python_version >= '3.14'",
174:   # HEIF/HEIC/AVIF decode for the vision tools. iPhone photos and screenshots
175:   # are HEIC (frequently mislabeled .jpg by upload pipelines); Pillow has no
176:   # built-in HEIF codec, so without this the vision resolver rejects them as
177:   # "not a recognized image". pillow-heif registers a Pillow opener so
178:   # _normalize_to_supported_image can re-encode HEIF/AVIF to PNG before embed.
179:   # Ships prebuilt wheels bundling libheif for the common platforms (no system
180:   # libs needed), so it's safe in the base install alongside Pillow.
181:   "pillow-heif>=1.4.0,<2; python_version >= '3.14'",
182:   # SVG rendering for the icon generator (scripts/generate_icons.py). Source
183:   # builds render icons with the runtime interpreter (`hermes desktop`,
184:   # `hermes update`), so a source install carries its renderer instead of
185:   # preparing a separate environment at launch. abi3 wheels for every
186:   # shipped platform, including Windows ARM64 and Android.
187:   "resvg-py==0.4.0; python_version >= '3.14'",
188:   # Windows log rotation. Stdlib ``RotatingFileHandler.doRollover()`` uses
189:   # ``os.rename()`` which fails with ``PermissionError [WinError 32]`` on
190:   # Windows whenever any other process holds an append-mode handle on
191:   # ``agent.log`` (always the case in Hermes — TUI, gateway, ``hy_memory``
192:   # server, MCP servers, and on-demand CLI commands all log from separate
193:   # processes), pinning ``agent.log`` at the 5 MiB threshold and spamming
194:   # stderr on every emit (see #44873). ``concurrent-log-handler`` wraps the
195:   # rename in a cross-process file lock (via ``portalocker``: pywin32 on
196:   # Windows) so only one process rotates at a time. ``hermes_logging.py``
197:   # aliases it ONLY on Windows — POSIX renames an open file fine, so stdlib
198:   # already works there and managed-mode perms depend on its exact lifecycle.
199:   # Hence the ``sys_platform == 'win32'`` marker: the dep (and its portalocker
200:   # / pywin32 tree) ships only where it's actually used.
201:   "concurrent-log-handler==0.9.29; sys_platform == 'win32' and python_version >= '3.14'",
202:   # First-party lifecycle and shared-metrics runtime. Relay 0.9 is the supported
203: [CREDENTIAL-RELATED LINE OMITTED]
204:   # response data through this native module in-process; shared metrics installs
205:   # no network exporter and consumes only its bounded projection. This marker
206:   # must stay false anywhere no compatible native wheel tag can match; otherwise
207:   # installing Python dependencies fails instead of falling back to the no-op
208:   # Relay host (#76469, Termux).
209:   # Termux Python reports plain linux/aarch64 but runs on Bionic
210:   # libc, which satisfies neither manylinux nor musllinux, hence the
211:   # `'android' not in platform_release` guard on the linux arms: Android GKI
212:   # kernels embed "-androidNN-" in the kernel release string. (Official PEP
213:   # 738 CPython reports sys_platform == 'android' and never matched.) Pre-GKI
214:   # devices can still slip through; they get the same resolution failure as
215:   # before, worked around by installing with `--no-deps` or an older release.
216:   "nemo-relay>=0.9,<0.10; ((sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and platform_machine == 'x86_64' and 'android' not in platform_release) or (sys_platform == 'linux' and platform_machine == 'aarch64' and 'android' not in platform_release) or (sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'win32' and platform_machine == 'ARM64')) and python_version >= '3.14'",]
217: 
218: [project.optional-dependencies]
219: # High-performance event loop — uvloop replaces the stdlib asyncio loop with
220: # a libuv-backed implementation for ~2-4x throughput on uvicorn.  Gated as an
221: # optional extra because libuv's ./configure does not run on Android/Termux
222: # (bionic libc, non-FHS layout).  Desktop and server installs pull this via
223: # [all]; the [termux] / [termux-all] profiles intentionally omit it.
224: uvloop = [
225:   "uvloop>=0.15.1,<0.24; sys_platform != 'win32' and sys_platform != 'cygwin' and sys_platform != 'android' and platform_python_implementation != 'PyPy'",
226: ]
227: # Native Anthropic provider — only needed when provider=anthropic (not via
228: # OpenRouter or other aggregators).
229: anthropic = ["anthropic==0.87.0"] # CVE-2026-34450, CVE-2026-34452
230: # Web search backends — each only loaded when the user picks it as their
231: # search provider (configured via `hermes tools` or config.yaml).
232: exa = ["exa-py==2.10.2"]
233: firecrawl = ["firecrawl-py==4.17.0"]
234: parallel-web = ["parallel-web==0.4.2"]
235: ddgs = ["ddgs==9.16.0"]
236: # Image generation backends
237: fal = ["fal-client==0.13.1"]
238: # Edge TTS — default TTS provider but still optional (users can pick
239: # ElevenLabs / OpenAI / MiniMax instead).
240: edge-tts = ["edge-tts==7.2.7"]
241: # NeuTTS's upstream Python ceiling excludes the managed interpreter.
242: # Keep dependency markers and PM gates together: bundles omit them, explicit
