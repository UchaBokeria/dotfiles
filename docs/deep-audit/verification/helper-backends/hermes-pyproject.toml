244: neutts = ["neutts[all]==1.4.1; python_version < '3.14'"]
245: kittentts = [
246:   "kittentts @ https://github.com/KittenML/KittenTTS/releases/download/0.8.1/kittentts-0.8.1-py3-none-any.whl ; (platform_machine != 'ARM64' or sys_platform != 'win32') and (platform_machine != 'x86_64' or sys_platform != 'darwin')",
247:   # KittenTTS requires misaki[en]>=0.9.4, and PyPI's misaki 0.9.4 caps Python
248:   # below 3.13. The NousResearch fork is the same 0.9.4 code with the cap
249:   # raised to <3.15. Declaring it here makes KittenTTS's transitive
250:   # requirement resolve to the fork. Drop this line when upstream misaki
251:   # publishes a release that allows 3.14.
252:   "misaki[en] @ git+https://github.com/NousResearch/misaki.git@f03fd2be7346952a83d3d4845c217fc7667f322d ; (platform_machine != 'ARM64' or sys_platform != 'win32') and (platform_machine != 'x86_64' or sys_platform != 'darwin')",
253:   "soundfile==0.14.0; (platform_machine != 'ARM64' or sys_platform != 'win32') and (platform_machine != 'x86_64' or sys_platform != 'darwin')",
254: ]
255: # onnxruntime has no Intel macOS wheel. Piper has no Windows ARM64 wheel.
256: piper = [
257:   "piper-tts==1.8.0; (platform_machine != 'ARM64' or sys_platform != 'win32') and (platform_machine != 'x86_64' or sys_platform != 'darwin')",
258: ]
259: modal = ["modal==1.5.5"]
260: daytona = ["daytona==0.155.0"]
261: vercel = ["vercel==0.7.2"]
262: google-meet = ["playwright==1.62.0", "websockets==15.0.1"]
263: messaging = [
264:   "python-telegram-bot[webhooks]==22.8",
265:   "discord.py[voice]==2.7.1",
266:   "aiohttp==3.14.3",
267:   "brotlicffi==1.2.0.2",
268:   "slack-bolt==1.30.0",
269:   "slack-sdk==3.44.1",
270:   "qrcode==7.4.2",
271: ] # aiohttp 3.14.3: prior CVEs + GHSA-cq5v-8q36-5273/GHSA-mfx4-hv73-q22v/GHSA-mq44-7p77-q5h7
272: cron = [] # croniter is now a core dependency; this extra kept for back-compat
273: slack = ["slack-bolt==1.30.0", "slack-sdk==3.44.1", "aiohttp==3.14.3"]
274: # Matrix gateway deps. `mautrix[encryption]` pulls `python-olm`, whose
275: # vendored libolm (archived 2023) cannot build on Windows or modern macOS:
276: # no wheels for those targets AND the sdist fails to compile on current
