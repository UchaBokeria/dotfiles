318:   "sherpa-onnx-core==1.13.8",
319: [CREDENTIAL-RELATED LINE OMITTED]
320:   "sentencepiece==0.2.2",
321:   "pypinyin==0.55.0",
322:   "pvporcupine==4.0.3",
323:   "sounddevice==0.5.5",
324:   "numpy==2.4.3",
325: ]
