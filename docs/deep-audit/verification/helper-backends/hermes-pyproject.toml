550: # setuptools.build_meta + our setup.py bdist_wheel guard import wheel during
551: # PEP 517 isolated builds. Without wheel in
552: # requires, the isolation sandbox only gets setuptools and the build
553: # fails with ModuleNotFoundError: wheel.cli (#96488).
554: requires = ["setuptools==83.0.0", "wheel"]
555: build-backend = "setuptools.build_meta"
