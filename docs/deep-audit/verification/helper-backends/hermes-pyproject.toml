918: # ASYNC ratchet baseline — legacy blocking sites that predate the gate.
919: # Each entry is an EXISTING violation being fixed in its own PR; do NOT add
920: # new files here.  Remove the entry when the file's sites are fixed.
921: # ---------------------------------------------------------------------------
