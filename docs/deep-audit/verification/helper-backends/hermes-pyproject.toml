333: # stt-whisper + audio-io compose [voice] (faster-whisper / sounddevice / numpy).
334: stt-whisper = [
335:   "faster-whisper==1.2.1; (platform_machine != 'ARM64' or sys_platform != 'win32') and (platform_machine != 'x86_64' or platform_system != 'Darwin')",
336: ]
337: audio-io = ["sounddevice==0.5.5", "numpy==2.4.3"]
338: # WeChat voice decode (tools/transcription_tools.py self-heal path).
