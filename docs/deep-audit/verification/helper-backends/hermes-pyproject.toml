923: # process (no wait), an accepted momentary spawn cost pending a dedicated
924: # async-subprocess sweep.
925: "gateway/run.py" = ["ASYNC220"]
926: "gateway/run_shutdown.py" = ["ASYNC220"]
927: "gateway/slash_commands.py" = ["ASYNC220"]
928: # Off-loop sweep for these routers is in flight (PR #84376).
929: "hermes_cli/web_routers/profiles.py" = ["ASYNC220", "ASYNC221"]
930: # Legacy blocking spawn sites in platform adapters, pending their own fixes.
931: "plugins/platforms/whatsapp/adapter.py" = ["ASYNC220", "ASYNC221"]
932: "plugins/platforms/photon/adapter.py" = ["ASYNC220"]
