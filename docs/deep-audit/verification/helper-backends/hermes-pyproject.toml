284:   "asyncpg==0.31.0; sys_platform == 'linux'",
285:   "aiohttp-socks==0.11.0; sys_platform == 'linux'",
286:   "aiohttp==3.14.3; sys_platform == 'linux'",
287: ] # aiohttp 3.14.3: prior CVEs + GHSA-cq5v-8q36-5273/GHSA-mfx4-hv73-q22v/GHSA-mq44-7p77-q5h7 (mautrix/aiohttp-socks only cap aiohttp<4 / >=3.10, so pin the patched floor directly)
288: 
