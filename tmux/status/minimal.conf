# blackwall tmux status - variant: minimal
#
# No fills anywhere. The current window is the only bold thing on the line and
# carries a thin rule underneath it; everything else is muted text. Nothing
# here depends on a font having powerline glyphs, so it renders identically in
# any terminal.
#
# NOTE: no #{...} in any *style* option. tmux expands formats in format options
# (status-left, window-status-format, ...) but NOT in style options
# (status-style, window-status-style, ...) - a `bg=#{@bw_bg}` there is an
# invalid style, and tmux draws the whole bar blank rather than complaining.
# Every colour below therefore lives inside a format string, and the style
# options stay on `default`, which is the terminal's own background - already
# the palette background, since kitty is themed from the same source.

set -g status-justify left
set -g status-left-length 200
set -g status-right-length 200
set -g status-style "bg=default,fg=default"
set -g window-status-separator ""

set -g status-left "#[fg=#{@bw_muted},bold] #S #[fg=#{@bw_edge},nobold]│ "

set -g status-right "#{?client_prefix,#[fg=#{@bw_warn}]PREFIX  ,}\
#[fg=#{@bw_faint}]%a %d  #[fg=#{@bw_fg},bold]%R "

set -g window-status-format "#[fg=#{@bw_faint}]  #I #W  "
set -g window-status-current-format "#[fg=#{@bw_accent},bold,underscore]  #I #W  #[default]"
