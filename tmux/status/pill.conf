# blackwall tmux status - variant: pill
#
# Rounded capsules built from Nerd Font half circles (U+E0B6 / U+E0B4). The
# same shape language as the waybar pill variant. Needs a font with powerline
# coverage; kitty gets there via the symbol_map in kitty.conf.
#
# NOTE: no #{...} in any *style* option. tmux expands formats in format options
# (status-left, window-status-format, ...) but NOT in style options
# (status-style, window-status-style, ...) - a `bg=#{@bw_bg}` there is an
# invalid style, and tmux draws the whole bar blank rather than complaining.
# Every colour below therefore lives inside a format string, and the style
# options stay on `default`, which is the terminal's own background - already
# the palette background, since kitty is themed from the same source.

set -g status-justify left
set -g status-left-length 200
set -g status-right-length 200
set -g status-style "bg=default,fg=default"
set -g window-status-separator ""

set -g status-left "#[fg=#{@bw_raised}]#[fg=#{@bw_fg},bg=#{@bw_raised},bold]#S#[fg=#{@bw_raised},bg=default,nobold] "

set -g status-right "#[fg=#{@bw_faint}]#{?client_prefix,#[fg=#{@bw_warn}]  ,}\
#[fg=#{@bw_fg},bold]%R #[fg=#{@bw_faint},nobold] "

set -g window-status-format "#[fg=#{@bw_faint}]  #I #W  "
set -g window-status-current-format "#[fg=#{@bw_accent}]#[fg=#{@bw_on_accent},bg=#{@bw_accent},bold]#I #W#[fg=#{@bw_accent},bg=default,nobold]"
