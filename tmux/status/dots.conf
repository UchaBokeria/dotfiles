# blackwall tmux status - variant: dots
#
# A page indicator rather than a list. Every window is a dot; only the current
# one is named. With five windows that reclaims most of the line, and with
# twenty it still fits - which the named-list variants do not.
#
# The trade is real: you can see *where* you are and how many there are, but
# not what the other windows contain.
#
# NOTE: no #{...} in any *style* option. tmux expands formats in format options
# (status-left, window-status-format, ...) but NOT in style options
# (status-style, window-status-style, ...) - a `bg=#{@bw_bg}` there is an
# invalid style, and tmux draws the whole bar blank rather than complaining.
# Every colour below therefore lives inside a format string, and the style
# options stay on `default`, which is the terminal's own background - already
# the palette background, since kitty is themed from the same source.

set -g status-justify left
set -g status-left-length 200
set -g status-right-length 200
set -g status-style "bg=default,fg=default"
set -g window-status-separator ""

set -g status-left "#[fg=#{@bw_muted},bold] #S #[fg=#{@bw_edge},nobold]│ "

set -g status-right "#{?client_prefix,#[fg=#{@bw_warn}]  ,}\
#[fg=#{@bw_faint}]#{session_windows} windows  #[fg=#{@bw_fg},bold]%R "

set -g window-status-format "#[fg=#{@bw_faint}] ● "
set -g window-status-current-format "#[fg=#{@bw_accent},bold] ●#[nobold] #W "
