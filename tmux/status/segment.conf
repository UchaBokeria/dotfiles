# blackwall tmux status - variant: segment
#
# Several joined segments, but with rounded joins rather than the angular
# powerline chevrons this variant used to use. The chevron is what made it read
# as blocky: it is a hard 45-degree wedge, and next to a rice whose every other
# surface is a pill it looked like it came from a different toolkit.
#
# The trick for a rounded join between two *filled* segments is to draw the
# right-cap glyph with fg = the colour of the segment that is ending and bg =
# the colour of the one beginning. The cap then reads as the rounded end of the
# first segment sitting on top of the second, rather than as a glyph of its
# own. The outermost caps use bg=default so they round against the bar.
#
# NOTE: no #{...} in any *style* option. tmux expands formats in format
# options (status-left, window-status-format, ...) but NOT in style options
# (status-style, window-status-style, ...) - a `bg=#{@bw_bg}` there is an
# invalid style, and tmux draws the whole bar blank rather than complaining.

set -g status-justify left
set -g status-left-length 200
set -g status-right-length 200
set -g status-style "bg=default,fg=default"
set -g window-status-separator ""

# session (accent) -> host (raised) -> bar
set -g status-left "#[fg=#{@bw_accent}]#[fg=#{@bw_on_accent},bg=#{@bw_accent},bold]#S#[fg=#{@bw_accent},bg=#{@bw_raised},nobold]#[fg=#{@bw_muted},bg=#{@bw_raised}] #{host_short} #[fg=#{@bw_raised},bg=default] "

# bar -> date (raised) -> clock (accent)
set -g status-right "#{?client_prefix,#[fg=#{@bw_warn}]  ,}#[fg=#{@bw_raised},bg=default]#[fg=#{@bw_muted},bg=#{@bw_raised}] %a %d #[fg=#{@bw_accent},bg=#{@bw_raised}]#[fg=#{@bw_on_accent},bg=#{@bw_accent},bold]%R#[fg=#{@bw_accent},bg=default,nobold]"

set -g window-status-format "#[fg=#{@bw_faint}]  #I #W  "
set -g window-status-current-format "#[fg=#{@bw_accent}]#[fg=#{@bw_on_accent},bg=#{@bw_accent},bold]#I #W#[fg=#{@bw_accent},bg=default,nobold]"
