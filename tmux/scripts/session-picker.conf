# Persistent nested workspaces around the native session tree.
# General and Archive are protected. Workspace deletion archives sessions.
bind s run-shell -b '~/.config/tmux/scripts/workspaces.py open --client "#{client_name}" --pane "#{pane_id}"'
bind W run-shell -b '~/.config/tmux/scripts/workspaces.py menu --client "#{client_name}" --pane "#{pane_id}"'

bind -n h if-shell -F '#{==:#{pane_mode},tree-mode}' {
    run-shell -b '~/.config/tmux/scripts/workspaces.py hide --client "#{client_name}" --pane "#{pane_id}"'
} {
    send-keys h
}

bind -n u if-shell -F '#{==:#{pane_mode},tree-mode}' {
    run-shell -b '~/.config/tmux/scripts/workspaces.py restore --client "#{client_name}" --pane "#{pane_id}"'
} {
    send-keys u
}

bind -n C-r if-shell -F '#{==:#{pane_mode},tree-mode}' {
    run-shell -b '~/.config/tmux/scripts/workspaces.py toggle-archive --client "#{client_name}" --pane "#{pane_id}"'
} {
    send-keys C-r
}

bind -n H if-shell -F '#{==:#{pane_mode},tree-mode}' {
    run-shell -b '~/.config/tmux/scripts/workspaces.py previous --client "#{client_name}" --pane "#{pane_id}"'
} {
    send-keys H
}

bind -n L if-shell -F '#{==:#{pane_mode},tree-mode}' {
    run-shell -b '~/.config/tmux/scripts/workspaces.py next --client "#{client_name}" --pane "#{pane_id}"'
} {
    send-keys L
}

bind -n Tab if-shell -F '#{==:#{pane_mode},tree-mode}' {
    run-shell -b '~/.config/tmux/scripts/workspaces.py next --client "#{client_name}" --pane "#{pane_id}"'
} {
    send-keys Tab
}

bind -n BTab if-shell -F '#{==:#{pane_mode},tree-mode}' {
    run-shell -b '~/.config/tmux/scripts/workspaces.py previous --client "#{client_name}" --pane "#{pane_id}"'
} {
    send-keys BTab
}

bind -n w if-shell -F '#{==:#{pane_mode},tree-mode}' {
    run-shell -b '~/.config/tmux/scripts/workspaces.py session-menu --client "#{client_name}" --pane "#{pane_id}"'
} {
    send-keys w
}

bind -n c if-shell -F '#{==:#{pane_mode},tree-mode}' {
    run-shell -b '~/.config/tmux/scripts/workspaces.py prompt --kind session --client "#{client_name}" --pane "#{pane_id}"'
} {
    send-keys c
}

bind -n R if-shell -F '#{==:#{pane_mode},tree-mode}' {
    run-shell -b '~/.config/tmux/scripts/workspaces.py session-rename --client "#{client_name}" --pane "#{pane_id}"'
} {
    send-keys R
}

bind -n [ if-shell -F '#{==:#{pane_mode},tree-mode}' {
    run-shell -b '~/.config/tmux/scripts/workspaces.py parent --client "#{client_name}" --pane "#{pane_id}"'
} {
    send-keys [
}

bind -n ] if-shell -F '#{==:#{pane_mode},tree-mode}' {
    run-shell -b '~/.config/tmux/scripts/workspaces.py child --client "#{client_name}" --pane "#{pane_id}"'
} {
    send-keys ]
}

# Run after the theme/plugins finish; existing Resurrect/Continuum hooks stay intact.
run-shell -b 'sleep 2; exec ~/.config/tmux/scripts/workspaces.py init'

bind -n m if-shell -F '#{==:#{pane_mode},tree-mode}' {
    run-shell -b '~/.config/tmux/scripts/workspaces.py move --client "#{client_name}" --pane "#{pane_id}"'
} {
    send-keys m
}

bind -n ? if-shell -F '#{==:#{pane_mode},tree-mode}' {
    run-shell -b '~/.config/tmux/scripts/workspaces.py help --client "#{client_name}" --pane "#{pane_id}"'
} {
    send-keys ?
}

bind -n D if-shell -F '#{==:#{pane_mode},tree-mode}' {
    run-shell -b '~/.config/tmux/scripts/workspaces.py request-purge --client "#{client_name}" --pane "#{pane_id}"'
} {
    send-keys D
}
