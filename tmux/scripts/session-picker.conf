# Native session tree, including tmux's previews, mouse support and vi j/k.
bind s choose-tree -Zs -f '#{!=:#{@session-picker-hidden},1}'

# Tree mode has no configurable key table. Its native ':' command acts on
# the selected/tagged items; send-keys -K types into that native prompt.
# Outside tree mode, forward each key directly to the pane as usual.
bind -n h if-shell -F '#{==:#{pane_mode},tree-mode}' {
    send-keys :
    send-keys -K -l 'set-option @session-picker-hidden 1 ; display-message "Session hidden (Ctrl+R to reveal)"'
    send-keys -K Enter
} {
    send-keys h
}
bind -n u if-shell -F '#{==:#{pane_mode},tree-mode}' {
    send-keys :
    # Capture the caller's pane before the native command changes its target
    # context to the highlighted session. Reopen the filtered tree there.
    run-shell -C "send-keys -K -l 'set-option @session-picker-hidden 0 ; send-keys -t #{pane_id} q ; choose-tree -t #{pane_id} -Zs -f \"##{!=:##{@session-picker-hidden},1}\" ; display-message \"Session restored to normal list\"'"
    send-keys -K Enter
} {
    send-keys u
}
bind -n C-r if-shell -F '#{==:#{pane_mode},tree-mode}' {
    send-keys f
    send-keys -K C-u
    send-keys -K -l '1'
    send-keys -K Enter
} {
    send-keys C-r
}
