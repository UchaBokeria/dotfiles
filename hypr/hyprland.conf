# configs

# Generated from the palette by theme/blackwall-theme. Sourced first so
# every $bw_* variable exists before anything below refers to it.
source = ~/.config/hypr/configs/colors.conf

source = ~/.config/hypr/configs/monitors.conf
source = ~/.config/hypr/configs/env.conf
source = ~/.config/hypr/configs/exec.conf
source = ~/.config/hypr/configs/keybinds.conf
source = ~/.config/hypr/configs/windowrules.conf
source = ~/.config/hypr/configs/animations.conf
source = ~/.config/hypr/configs/stickers.conf
source = ~/.config/hypr/configs/archpilot.conf

source = ~/.config/hypr/configs/scrolling.conf
render {
  send_content_type = false
  cm_auto_hdr = 0
}

general {
    gaps_in = 5
    gaps_out = 20

    border_size = 2

    # Was hyprland's stock demo gradient - rgba(33ccffee) rgba(00ff99ee), a
    # cyan-to-green that belonged to no palette this rice has ever had. These
    # follow the wallpaper; see hypr/configs/colors.conf.
    col.active_border = $bw_border_active
    col.inactive_border = $bw_border_inactive

    resize_on_border = false

    allow_tearing = false

    # `scrolling` is Hyprland's own niri-style layout (0.5x+), not a plugin.
    # Set to `dwindle` to go back to the old tiling.
    layout = dwindle
}

decoration {
    # 12 is the app-window step of the radius scale in
    # theme/blackwall_theme/tokens.py. Panels round themselves in their own CSS
    # and are larger: archpilot overrides this to 22 to match its stylesheet.
    rounding = 12
    rounding_power = 2

    # Content windows are opaque. Translucency in this rice lives in the chrome
    # layer - bar, launcher, notifications, power menu - and it is applied to
    # each surface's own background colour. A compositor opacity rule would
    # fade the text along with the fill, which is the one thing frosted glass
    # never does.
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        # A wider, softer, weaker shadow reads as a window floating above a
        # surface; the old range 4 at ee alpha read as a hard dark outline.
        range = 22
        render_power = 3
        offset = 0 6
        color = $bw_shadow
        color_inactive = $bw_shadow_inactive
    }

    blur {
	enabled = true

	size = 8
	passes = 3

	# xray made blur skip other windows and sample only the wallpaper, so a
	# terminal behind a translucent surface stayed perfectly sharp through
	# it - the one thing frosted glass never does. Off means the blur shows
	# what is actually behind. Layer surfaces set this per-rule as well;
	# see configs/windowrules.conf.
	xray = false
	ignore_opacity = false
	new_optimizations = true

	# Menus and dropdowns are chrome too.
	popups = true
	popups_ignorealpha = 0.2
    }
}

dwindle {
    #preserve_split = true # You probably want this
    preserve_split = true # You probably want this
}

master {
    new_status = master
}

misc {
	mouse_move_enables_dpms = true
	key_press_enables_dpms = true
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
	# vrr = 0
}


#############
### INPUT ###
#############
input {
    kb_layout = us,ge
    kb_variant =
    kb_model =
    kb_options = grp:ctrl_alt_k_toggle
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

gesture = 3, horizontal, workspace

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}



