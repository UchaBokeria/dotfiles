general {
    grace = 10
    hide_cursor = true
}

background {
    monitor =
    path = ~/.config/wallpapers/japanese_aesthetic.png
    color = rgba(33, 34, 44, 1.0)
    blur_passes = 0
}

input-field {
    monitor =
    size = 300, 40
    position = -500, -95
    halign = center
    valign = center

    outline_thickness = 0
    rounding = 100

outer_color = rgba(0,0,0,0,0)
outline_thickness = 2
    font_color = rgb(50, 48, 47)
inner_color = rgba(34, 34, 34, 0.15)
    placeholder_text = Password
    fade_on_empty = false

    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true
    hide_input = false

    font_family = Electroharmonix
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(50, 48, 47)
    font_size = 60
    font_family = Electroharmonix

    position = -520, 125
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A %-d")"
    color = rgb(50, 48, 47)
    font_size = 20
    font_family = Electroharmonix

    position = -520, 60
    halign = center
    valign = center
}

animations {
    enabled = false
}

timer {
    timeout = 60
    on-timeout = hyprctl dispatch dpms off
}
