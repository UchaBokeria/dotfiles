# ArchPilot - system-wide AI assistant.
# Daemon runs as a systemd user unit (archpilotd.service), not from exec-once,
# so it survives independently of the compositor session.

# SUPER + ~   toggle the GTK window (vim editing, real keyboard focus)
bind = SUPER, grave, exec, ~/.config/.dotfiles/blackwall/archpilot/.venv/bin/archpilot ui --toggle

# SUPER + SHIFT + ~   region screenshot, staged for the next prompt
bind = SUPERSHIFT, grave, exec, ~/.config/.dotfiles/blackwall/archpilot/.venv/bin/archpilot shot

# SUPER + CTRL + ~   browse Claude Code sessions (rofi)
bind = SUPERCONTROL, grave, exec, ~/.config/.dotfiles/blackwall/archpilot/.venv/bin/archpilot sessions

# SUPER + ALT + ~   browse and re-ask past prompts (rofi)
bind = SUPERALT, grave, exec, ~/.config/.dotfiles/blackwall/archpilot/.venv/bin/archpilot history

# --------------------------------------------------------------------------
# No submap.
#
# The widget used to put hyprland into an `archpilot-gtk` submap while it had
# focus, which made every SUPER binding on the machine inert. That bought
# nothing: of the 127 global binds here, 117 use SUPER, ten are bare media
# keys and one is CTRL+ALT+K - and the widget uses none of those combinations,
# so there was never anything to protect it from. What it did cost was a
# failure mode where a crashed widget left the submap active with no window on
# screen, and the whole keyboard stopped responding with nothing to explain it.
# --------------------------------------------------------------------------

windowrule = match:class ^(dev\.archpilot\.ui)$, float on
windowrule = match:class ^(dev\.archpilot\.ui)$, center on
windowrule = match:class ^(dev\.archpilot\.ui)$, pin on
# windowrules.conf ends with a catch-all `match:class ^(.*)$, size 1000 750`,
# so every window is forced to that size and nothing can size itself to its
# content. This file is sourced after it, so this rule wins.
windowrule = match:class ^(dev\.archpilot\.ui)$, size 900 190
# Blur what is actually behind the widget, not just the wallpaper. The global
# blur sets xray on, which makes blur skip other windows - so a terminal behind
# the widget stayed perfectly sharp through it, which is the one thing frosted
# glass never does.
windowrule = match:class ^(dev\.archpilot\.ui)$, xray off

windowrule = match:class ^(dev\.archpilot\.ui)$, border_size 0
# Must match `r_window` in archpilot/src/archpilot/ui/theme.py. GTK clips
# its background and border at its own radius; when the two disagree the
# hairline stops short of each corner.
windowrule = match:class ^(dev\.archpilot\.ui)$, rounding 22
