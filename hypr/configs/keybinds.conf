# menus.conf defines $SUPER and the launcher commands, and is tracked.
source = ~/.config/hypr/configs/menus.conf

$terminal = kitty
$fileManager = thunar

## general
bind = $SUPERCONTROL, SPACE, exec, fish -c "cd $HOME/.config/.dotfiles/blackwall/hyprmod/hyprmod; uv run hyprmod"

bind = $SUPER, return, exec, $terminal

bind = $SUPERshift, return, exec, env START_TMUX=0 $terminal 
bind = $SUPER, W, killactive,
bind = $SUPER, B, fullscreen, 0

bind = $SUPER, R, exec, $appMenu_grid
bind = $SUPER, U, exec, $rofiPaper
bind = $SUPER, F, exec, $appMenu_list -show filebrowser -filebrowser-directory ~/.config
bind = $SUPERSHIFT, F, exec, $fileManager 

bind = $SUPER, V, togglefloating,
bind = $SUPER, P, pseudo, # dwindle
#bind = $SUPER, -, togglesplit, # dwindle
bind=$SUPERSHIFT,Q,exec,~/.config/wlogout/launch
# Clipboard history. Was wl-clipboard-history piped through dmenu - neither is
# installed. cliphist is, and it was already being used by two eww buttons, so
# this unifies on it and gives it the rice's own rofi theme.
bind = $SUPERSHIFT, V, exec, $clipHistory
#bind = $SUPER, M, exec, eww reload && sleep 2 && eww open --toggle test
bind = CTRL ALT, K, exec, hyprctl switchxkblayout current next
bind = $SUPERCONTROL, Q, exec, hyprlock
bind = $SUPER, N, exec, flameshot gui

## Stickers
bind = $SUPER, M, exec, ~/.config/eww/scripts/toggle my-sticker-window

## Mouse
bindm=$SUPER,mouse:272,movewindow
bindm=$SUPER,mouse:273,resizewindow
# SUPER+scroll now walks columns; see configs/scrolling.conf.

## Navigation
bind = $SUPER, h, movefocus, l
bind = $SUPER, l, movefocus, r
bind = $SUPER, k, movefocus, u
bind = $SUPER, j, movefocus, d
bindr=$SUPERSHIFT,h,movewindow,l
bindr=$SUPERSHIFT,l,movewindow,r
bindr=$SUPERSHIFT,k,movewindow,u
bindr=$SUPERSHIFT,j,movewindow,d
bindr=$SUPERCONTROL,h,workspace,-1
bindr=$SUPERCONTROL,l,workspace,+1
bindr=$SUPERCONTROL,k,focusmonitor,l
bindr=$SUPERCONTROL,j,focusmonitor,r
#bindr=$SUPERALT,h,splitratio,-0.1
bindr=$SUPER,left,movefocus,l
bindr=$SUPER,right,movefocus,r
bindr=$SUPER,up,movefocus,u
bindr=$SUPER,down,movefocus,d
bindr=$SUPERSHIFT,left,movewindow,l
bindr=$SUPERSHIFT,right,movewindow,r
bindr=$SUPERSHIFT,up,movewindow,u
bindr=$SUPERSHIFT,down,movewindow,d
bindr=$SUPERCONTROL,left,workspace,-1
bindr=$SUPERCONTROL,right,workspace,+1
bindr=$SUPERCONTROL,up,focusmonitor,l
bindr=$SUPERCONTROL,down,focusmonitor,r
bindr=$SUPER,Tab,workspace,previous
binde=$SUPERALT,left,resizeactive,-20 0
binde=$SUPERALT,right,resizeactive,20 0
binde=$SUPERALT,up,resizeactive,0 -20
binde=$SUPERALT,down,resizeactive,0 20

# Switch workspaces with $SUPER + [0-9]
bind = $SUPER, 1, workspace, 1
bind = $SUPER, 2, workspace, 2
bind = $SUPER, 3, workspace, 3
bind = $SUPER, 4, workspace, 4
bind = $SUPER, 5, workspace, 5
bind = $SUPER, 6, workspace, 6
bind = $SUPER, 7, workspace, 7
bind = $SUPER, 8, workspace, 8
bind = $SUPER, 9, workspace, 9
bind = $SUPER, 0, workspace, 10

# Move active window to a workspace with $SUPER + SHIFT + [0-9]
bind = $SUPER SHIFT, 1, movetoworkspace, 1
bind = $SUPER SHIFT, 2, movetoworkspace, 2
bind = $SUPER SHIFT, 3, movetoworkspace, 3
bind = $SUPER SHIFT, 4, movetoworkspace, 4
bind = $SUPER SHIFT, 5, movetoworkspace, 5
bind = $SUPER SHIFT, 6, movetoworkspace, 6
bind = $SUPER SHIFT, 7, movetoworkspace, 7
bind = $SUPER SHIFT, 8, movetoworkspace, 8
bind = $SUPER SHIFT, 9, movetoworkspace, 9
bind = $SUPER SHIFT, 0, movetoworkspace, 10

# Utils
bind = $SUPER CTRL ALT, F9, exec, wf-recorder --audio="$(find_internal_audio)" -g "$(slurp)" -f $(xdg-user-dir VIDEOS)/recording-region-$(date +%Y%m%d-%H%M%S).mp4
bind = $SUPER CTRL SHIFT, F9, exec, wf-recorder --audio="$(find_internal_audio)" -f $(xdg-user-dir VIDEOS)/recording-$(date +%Y%m%d-%H%M%S).mp4
bind = $SUPER CTRL SHIFT, F10, exec, pkill wf-recorder && notify-send "Recording" "Stopped"

# ---- screen capture -------------------------------------------------------
# All of these ran `grimblast`, which is AUR-only and was never installed - so
# every one of them silently did nothing. Two more called `swappy` and `trans`,
# also absent. $shot is scripts/blackwall-shot, built on grim/slurp/wl-copy,
# all of which are present.
#
# Every capture lands on the clipboard AND on disk. That was the one behaviour
# these bindings disagreed about - some copied, some saved, none did both.
bind = $SUPERSHIFT, S, exec, $shot region
bind = $SUPER, Print, exec, $shot output
bind = $SUPERCONTROL, S, exec, $shot window
bind = $SUPERSHIFT, Print, exec, $shot region --edit

# Text out of pixels. Needs tesseract-data-eng; --translate also needs
# translate-shell. Both are in the official repos.
bind = $SUPER, O, exec, $shot region --ocr
bind = $SUPERSHIFT, O, exec, $shot region --translate

# Capture a region and ask ArchPilot about it.
bind = $SUPERALT, S, exec, $shot region --ask

# Browse past captures; every action above is available on an old shot too.
bind = $SUPERCONTROL, V, exec, $shotHistory

# Specials
bind=$SUPER,G,togglegroup,
# SUPER+SHIFT+G was bound to ~/.local/bin/gpu-switch, which does not exist and
# never did on this machine: there is one GPU (Intel Comet Lake UHD) and one
# render node, so there is nothing to switch between. Left over from a config
# copied off a hybrid-graphics laptop. The key is free.
bind=$SUPERSHIFT,space,changegroupactive,
bind=$SUPERALT,space,lockgroups,toggle

# Example special workspace (scratchpad)
bind = $SUPER, S, togglespecialworkspace, magic
bind = $SUPER SHIFT, S, movetoworkspace, special:magic
# Toggle special workspaces
bind = $SUPER, F1,  togglespecialworkspace, f1
bind = $SUPER, F2,  togglespecialworkspace, f2
bind = $SUPER, F3,  togglespecialworkspace, f3
bind = $SUPER, F4,  togglespecialworkspace, f4
bind = $SUPER, F5,  togglespecialworkspace, f5
bind = $SUPER, F6,  togglespecialworkspace, f6
bind = $SUPER, F7,  togglespecialworkspace, f7
bind = $SUPER, F8,  togglespecialworkspace, f8
bind = $SUPER, F9,  togglespecialworkspace, f9
bind = $SUPER, F10, togglespecialworkspace, f10
bind = $SUPER, F11, togglespecialworkspace, f11
bind = $SUPER, F12, togglespecialworkspace, f12

# Move active window to special workspaces
bind = $SUPER SHIFT, F1,  movetoworkspace, special:f1
bind = $SUPER SHIFT, F2,  movetoworkspace, special:f2
bind = $SUPER SHIFT, F3,  movetoworkspace, special:f3
bind = $SUPER SHIFT, F4,  movetoworkspace, special:f4
bind = $SUPER SHIFT, F5,  movetoworkspace, special:f5
bind = $SUPER SHIFT, F6,  movetoworkspace, special:f6
bind = $SUPER SHIFT, F7,  movetoworkspace, special:f7
bind = $SUPER SHIFT, F8,  movetoworkspace, special:f8
bind = $SUPER SHIFT, F9,  movetoworkspace, special:f9
bind = $SUPER SHIFT, F10, movetoworkspace, special:f10
bind = $SUPER SHIFT, F11, movetoworkspace, special:f11
bind = $SUPER SHIFT, F12, movetoworkspace, special:f12
# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Output/input device pickers. The media keys above talk to wpctl directly
# rather than through blackwall-audio - a volume key should not pay for a
# python start-up - but switching devices is rare and wants the picker.
bind = $SUPER, A, exec, $audio pick-sink
bind = $SUPERSHIFT, A, exec, $audio pick-source

# Notifications
bind = $SUPER, D, exec, swaync-client -t -sw
bind = $SUPERSHIFT, D, exec, ~/.config/.dotfiles/blackwall/scripts/blackwall-quiet dnd toggle
bind = $SUPERCONTROL, D, exec, ~/.config/.dotfiles/blackwall/scripts/blackwall-quiet pick
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

#



# submap
bind = $SUPER, Escape, exec, notify-send "Passthrough Mode"
bind = $SUPER, Escape, submap, Passthrough

submap = Passthrough
bind = $SUPER, Escape, exec, notify-send "Normal Mode"
bind = $SUPER, Escape, submap, reset
submap = reset

