animations {
  enabled = true

  # The rice's own curve, generated from tokens.py into configs/colors.conf.
  # Editing it there changes the widgets and the compositor together.
  bezier = bw_ease, $bw_ease

  bezier = md3_decel, 0.05, 0.7, 0.1, 1
  bezier = md3_accel, 0.3, 0.8, 0.15, 0
  bezier = menu_decel, 0.1, 1, 0, 1
  bezier = menu_accel, 0.38, 0.04, 1, 0.07

  # Windows
  animation = windows, 1, 3, md3_decel, popin 60%
  animation = windowsIn, 1, 3, md3_decel, slide
  animation = windowsOut, 1, 3, md3_accel, popin 60%

  # Movement is deliberately slower than opening and closing. Under the
  # scrolling layout this is the column scroll, and that is the one motion you
  # watch all the way through rather than glance at - a 300ms snap reads as a
  # jump cut, not as scrolling. Matches the workspace slide below so a column
  # and a workspace travel at the same rate.
  # Speed is in deciseconds: 7 = 700ms. This is the one number to change if
  # the scroll feels wrong - raise it to slow the travel, lower it to quicken.
  animation = windowsMove, 1, 7, bw_ease

  # Layers
  animation = layersIn, 1, 5, menu_decel, slide right
  animation = layersOut, 1, 3, menu_accel, slide right
  animation = fadeLayersIn, 1, 2, menu_decel
  animation = fadeLayersOut, 1, 4.5, menu_accel

  # Workspaces
  animation = workspaces, 1, 7, menu_decel, slide
  animation = specialWorkspace, 1, 3, md3_decel, slide

  # Fade
  animation = fade, 1, 3, md3_decel
}
