# Niri-style scrolling layout.
#
# This uses Hyprland's OWN `scrolling` layout, added in 0.5x - not a plugin.
# Worth stating plainly, because the obvious search leads somewhere useless:
# `hyprwm/hyprscrolling` does not exist, and `dawsers/hyprscroller`, the plugin
# everyone links to, was abandoned in April 2025 with a commit literally titled
# "Last commit :-(" - well before this compositor was built, and Hyprland's
# plugin ABI breaks between releases.
#
# The layout itself is set in hyprland.conf's `general {}` block, because a
# later `general {}` there silently overrides one set here. To go back to the
# old tiling, set it to `dwindle`; nothing in this file does anything then.

scrolling {
    # Half the screen per column, so two windows sit side by side and a third
    # scrolls in from the edge rather than shrinking the other two.
    column_width = 0.5

    # The widths SUPER+[ and SUPER+] cycle through.
    explicit_column_widths = 0.333, 0.5, 0.667, 1.0

    focus_fit_method = 1

    # How much of the focused column must be visible before the view scrolls.
    # The default 0.4 lets a column sit 60% off-screen and only jumps when it
    # passes that line, which is what makes movement feel like a series of
    # jump cuts. At 1.0 the view keeps the focused column whole, so it travels
    # with every step instead of catching up in lurches.
    follow_min_visible = 1.0

    follow_focus = 1
    wrap_focus = 0
}

# ---- moving through the row ------------------------------------------------
# SUPER+scroll walks columns, which is the gesture the layout exists for.
# Workspace switching moves to SUPER+CTRL+scroll rather than being lost.
bind = $SUPER, mouse_down, movefocus, r
bind = $SUPER, mouse_up, movefocus, l
bind = $SUPERCONTROL, mouse_down, workspace, e+1
bind = $SUPERCONTROL, mouse_up, workspace, e-1

# ---- column width and placement --------------------------------------------
bind = $SUPER, bracketright, layoutmsg, colresize next
bind = $SUPER, bracketleft, layoutmsg, colresize prev
bind = $SUPER, C, layoutmsg, center
bind = $SUPERSHIFT, G, layoutmsg, promote
