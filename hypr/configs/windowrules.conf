# --------------------------------------------------------------------------
# The chrome layer.
#
# waybar, rofi, mako and eww are layer-shell surfaces, not windows, so no
# `windowrule` will ever reach them - the compositor matches them by namespace
# instead. Without a rule here they get no blur at all, which is why the bar
# used to be a row of solid black lozenges however much alpha its CSS asked
# for: alpha alone shows the raw wallpaper, and it takes the compositor to turn
# that into frosted glass.
#
# `ignore_alpha` is the other half. Each of these surfaces is transparent
# except where it paints - waybar's window is fully see-through and only the
# module pills are filled. Without a threshold the compositor would blur the
# whole 1890x62 rectangle and leave a ghostly band across the top of the
# screen; with one it blurs only the pills.
#
# `xray off` matters for the same reason it did on the widget: xray makes blur
# skip windows and sample only the wallpaper, so a panel over a terminal would
# show blurred *wallpaper* rather than the blurred terminal actually behind it.
# --------------------------------------------------------------------------
layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0.2, match:namespace waybar
layerrule = xray off, match:namespace waybar

layerrule = blur on, match:namespace rofi
layerrule = ignore_alpha 0.15, match:namespace rofi
layerrule = xray off, match:namespace rofi

layerrule = blur on, match:namespace notifications
layerrule = ignore_alpha 0.15, match:namespace notifications
layerrule = xray off, match:namespace notifications

# eww. `eww_calendar` had blur explicitly off; it is a panel like the rest and
# there is no reason for it to be the one opaque surface in the chrome layer.
layerrule = blur on, match:namespace eww_ios
layerrule = ignore_alpha 0.15, match:namespace eww_ios
layerrule = xray off, match:namespace eww_ios

layerrule = blur on, match:namespace eww_calendar
layerrule = ignore_alpha 0.15, match:namespace eww_calendar
layerrule = xray off, match:namespace eww_calendar

layerrule = blur on, match:namespace eww_wifi
layerrule = ignore_alpha 0.15, match:namespace eww_wifi
layerrule = xray off, match:namespace eww_wifi

# wlogout dims the desktop behind itself, so it keeps dim_around.
layerrule = blur on, ignore_alpha 0.05, dim_around on, match:namespace logout_dialog
layerrule = blur on, ignore_alpha 0.05, dim_around on, match:namespace gtk-layer-shell

# --------------------------------------------------------------------------
# Content windows are opaque.
#
# What stood here was `windowrule = opacity 0.92 0.88` with no match clause, so
# it applied to every window on the machine - and a compositor opacity rule
# multiplies the finished surface, text included. That is what gave app text
# the slightly washed look; it is not the same thing as a translucent
# background and it cannot be made to look like one.
# --------------------------------------------------------------------------

# # Popups Floating
windowrule = match:tag portal-dialogs, size 50 60
windowrule = match:tag portal-dialogs, float true
windowrule = match:tag portal-dialogs, center on

windowrule = match:class ^(xdg-desktop-portal-gtk)$, float on
windowrule = match:class ^(xdg-desktop-portal-gtk)$, center on
windowrule = match:class ^(xdg-desktop-portal-gtk)$, size 1000 750

windowrule = match:class ^(xdg-desktop-portal-hyprland)$, float on
windowrule = match:class ^(xdg-desktop-portal-hyprland)$, float on
windowrule = match:class ^(xdg-desktop-portal-hyprland)$, center on

windowrule = match:class ^(xdg-desktop-portal-kde)$, float on
windowrule = match:class ^(xdg-desktop-portal-kde)$, center on
windowrule = match:class ^(xdg-desktop-portal-kde)$, size 1000 750


# # Waydroid
# windowrulev2 = float, class:^(Waydroid)$
# windowrulev2 = size 800 600, class:^(Waydroid)$
# windowrulev2 = center, class:^(Waydroid)$

windowrule = match:class ^(.*)$, float on
windowrule = match:class ^(.*)$, center on
windowrule = match:class ^(.*)$, size 1000 750
