# blackwall design tokens - generated, do not edit
# edit theme/blackwall_theme/tokens.py and run `blackwall-theme` instead
# palette: wallust handoff

# The motion curve every surface uses, for `bezier = name, $bw_ease`.
$bw_ease   = 0.32, 0.72, 0, 1

# Palette, for anything in hyprland.conf that needs a colour.
$bw_bg     = rgb(1c1d24)
$bw_fg     = rgb(fef5fd)
$bw_accent = rgb(ec71f5)
$bw_link   = rgb(83b0f9)
$bw_warn   = rgb(e4b363)
$bw_bad    = rgb(d2696a)

# Window borders. The inactive edge is a bare hairline of the foreground -
# present enough to separate two tiled windows, quiet enough that a screen full
# of them does not read as a grid of outlines.
$bw_border_active   = rgba(ec71f5d9) rgba(93a7f8d9) 45deg
$bw_border_inactive = rgba(fef5fd17)

# Shadows. Neutral black rather than tinted: a coloured shadow reads as a glow,
# and a glow is the thing that makes a rice look like a rice.
$bw_shadow          = rgba(0707099e)
$bw_shadow_inactive = rgba(07070961)

# Group bars (SUPER+G).
$bw_group_active   = rgba(ec71f5e6)
$bw_group_inactive = rgba(fef5fd24)
$bw_group_locked   = rgba(e4b363e6)
