exec-once = busctl -j --user call org.freedesktop.Notifications /fr/emersion/Mako fr.emersion.Mako -- ListNotifications
# --- notifications
# mako is NOT started here. It is dbus-activated through its systemd user
# unit; starting it from exec.conf as well meant the unit's own start
# attempt found the socket taken and exited 1, leaving mako.service in a
# failed state permanently. One owner only.
# Notifications. swaync if it is installed, mako otherwise - they both own
# org.freedesktop.Notifications, so exactly one may run. The test is on the
# binary rather than on a config flag so that installing the package is the
# only step needed to switch.
exec-once = sh -c 'if command -v swaync >/dev/null; then systemctl --user stop mako.service 2>/dev/null; exec swaync; else exec systemctl --user start mako.service; fi'

# Notification history recorder. Passive: it becomes a D-Bus monitor and logs
# every Notify call with a timestamp, while mako receives and displays them
# over its own connection exactly as before. mako's own buffer holds only a
# handful, carries no timestamps, and empties every time mako restarts - which
# a re-theme does.
exec-once = ~/.config/.dotfiles/blackwall/scripts/blackwall-notifyd

# --- wallpaper daemon
exec-once = ~/.config/hypr/scripts/last_wallpaper

# --- bar
exec-once = waybar 

# --- eww (daemon only; widgets launched separately)
exec-once = eww daemon

# wl-clipboard-history is not installed; cliphist replaced it (below).

# exec-once = hypridle

exec-once = wayvnc -R -v -L debug 127.0.0.1 5900
exec-once = xfsettingsd

# Clipboard history. cliphist only records what a wl-paste watcher feeds it,
# and nothing was starting one - so `cliphist list` had been empty since the
# day it was installed, and the two eww buttons calling it showed nothing.
exec-once = ~/.config/.dotfiles/blackwall/scripts/blackwall-clip --daemon

# Background checks - disk, failed units, pending config merges, ArchPilot
# waiting on approval. Read-only; the actions on each notification are what
# change anything, and only when clicked. TIERS="1 2" drops the noisy ones.
exec-once = ~/.config/.dotfiles/blackwall/scripts/blackwall-watch --daemon
