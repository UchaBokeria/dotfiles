# Modifier and menus.
#
# These used to live in configs/custom.conf, which is listed in .gitignore and
# was never committed - so a fresh clone of this rice had no $SUPER at all and
# every keybind in keybinds.conf silently referred to an empty modifier. This
# file is tracked, so a clone works.
$SUPER = SUPER

# The three rofi surfaces. All three share one generated glass theme
# (rofi/shared/blackwall.rasi) and differ only in layout, so re-theming the
# launcher means editing one file rather than three.
$appMenu_grid    = ~/.config/rofi/blackwall/launch grid
$appMenu_list    = ~/.config/rofi/blackwall/launch list
$appMenu_compact = ~/.config/rofi/blackwall/launch compact
$appMenu_wall    = ~/.config/rofi/blackwall/launch wall

# Kept so anything still referring to the old names keeps working.
$appMenu_1 = $appMenu_list
$appMenu_2 = $appMenu_compact
$appMenu_3 = $appMenu_grid

# Absolute, not bare names. The scripts in this repo were copied into /usr/bin
# rather than symlinked, so a bare `rofi-paper` resolved to a stale duplicate
# that knew nothing about the current layouts. `scripts/link-bin` fixes that
# for every caller; these paths make the keybinds independent of it.
$blackwall = ~/.config/.dotfiles/blackwall
$rofiPaper = ~/.config/.dotfiles/blackwall/scripts/rofi-paper
$setwall   = ~/.config/.dotfiles/blackwall/scripts/setwall

# Screen capture and clipboard, by absolute path for the same reason as above.
$shot        = ~/.config/.dotfiles/blackwall/scripts/blackwall-shot
$clipHistory = ~/.config/.dotfiles/blackwall/scripts/blackwall-clip
$audio       = ~/.config/.dotfiles/blackwall/scripts/blackwall-audio
$shotHistory = ~/.config/.dotfiles/blackwall/scripts/blackwall-shots
