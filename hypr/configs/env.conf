env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

env = LIBVA_DRIVER_NAME,iHD # for quest3

# Was QT_QFA_PLATFORMTHEME - a typo for QPA (Qt Platform Abstraction), so Qt
# never read qt6ct and every Qt app fell back to stock Fusion.
env = QT_QPA_PLATFORMTHEME,qt6ct
# Qt draws its own title bars and shadows on Wayland unless told not to; the
# compositor already provides both, and two shadows read as a smear.
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = GTK_USE_PORTAL,1
env = GDK_BACKEND,wayland

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

WINE_FULLSCREEN_FSR=1
