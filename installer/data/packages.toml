  { name = "python-gobject", source = "repo", why = "the `gi` bindings archpilot imports. archpilot has zero PyPI dependencies, so this is the only runtime library it needs. Dependency-only here" },
  { name = "gdk-pixbuf2", source = "repo", why = "gi.require_version('GdkPixbuf','2.0') in archpilot's UI. Dependency-only here" },
