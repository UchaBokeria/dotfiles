  { name = "networkmanager", source = "repo", why = "`nmcli`, the whole of scripts/blackwall-net and the eww network/wifi panels" },
  { name = "nm-connection-editor", source = "repo", why = "the 'advanced' escape hatch from the network panel. Dependency-only here" },
  { name = "network-manager-applet", source = "repo", why = "nm-applet, the tray fallback" },
  { name = "iw", source = "repo", why = "wireless interface state that nmcli does not expose, in scripts/blackwall-net" },
  { name = "iproute2", source = "repo", why = "`ip`, for link and address state in scripts/blackwall-net and blackwall-vpn. Dependency-only here" },
  { name = "bluez", source = "repo", why = "the bluetooth stack behind the eww bluetooth toggle" },
  { name = "bluez-utils", source = "repo", why = "`bluetoothctl`, which the eww control centre drives directly" },
  { name = "blueman", source = "repo", why = "blueman-manager, opened from the bluetooth panel's gear button" },

