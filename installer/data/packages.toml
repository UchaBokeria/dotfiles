note = """
Empty by construction, and checked: every one of the 442 packages in
`pacman -Qqe` on this machine appears in exactly one group above.

  442 explicit
  -  63 kde-plasma        (plasma group, less the 5 moved to core/theming)
  - 188 kde-apps          (kde-applications group)
  - 191 everything else   (core, fonts, theming, hypr-extras, shell-tools,
                           editors, dev, dev-ada, dev-unity, browsers, media,
                           messaging, network, security, virt, gaming, office,
                           system, misc)
  =   0 left over

The groups also contain 30-odd packages that are NOT in `pacman -Qqe` - they
are installed here only as dependencies of something else, and are named
explicitly because on a fresh box nothing would pull them in. That asymmetry is
the whole reason this file is not just a dump of `pacman -Qqe`.
"""
