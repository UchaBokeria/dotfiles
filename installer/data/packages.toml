  { name = "wl-clipboard", source = "repo", why = "wl-copy/wl-paste; scripts/blackwall-clip --daemon runs two `wl-paste --watch` processes, and blackwall-autostart counts them as the liveness test" },
  { name = "cliphist", source = "repo", why = "clipboard history behind SUPERSHIFT+V (keybinds.conf:28 -> scripts/blackwall-clip). It only ever sees what the wl-paste watchers feed it" },
  { name = "grim", source = "repo", why = "the actual screen capture in scripts/blackwall-shot" },
  { name = "slurp", source = "repo", why = "region select for blackwall-shot and for wf-recorder (keybinds.conf:98)" },
  { name = "tesseract", source = "repo", why = "OCR engine for `blackwall-shot --ocr`. Dependency-only here" },
  { name = "tesseract-data-eng", source = "repo", why = "the English OCR data. blackwall-shot:142 checks `tesseract --list-langs` and dies with 'pacman -S tesseract-data-eng' - the engine alone is useless. SUPER+O" },
  { name = "translate-shell", source = "repo", why = "`trans`, for `blackwall-shot --translate` behind SUPERSHIFT+O (blackwall-shot:168-179)" },
  { name = "wf-recorder", source = "repo", why = "screen recording on SUPER+CTRL+ALT+F9 and the eww/scripts/screen_recording toggle" },
  { name = "flameshot", source = "repo", why = "annotation for `blackwall-shot --edit` (SUPERSHIFT+Print); blackwall-shot:222 guards on `have flameshot`" },
  { name = "qrencode", source = "repo", why = "wifi QR codes in scripts/blackwall-net:325. The script notifies 'qrencode is not installed' if absent. Dependency-only here" },
  { name = "xdg-utils", source = "repo", why = "xdg-open, the last-resort image viewer in blackwall-net:328 and the opener for notification actions. Dependency-only here" },
  { name = "xdg-user-dirs", source = "repo", why = "xdg-user-dir VIDEOS, which is where keybinds.conf:98-99 writes recordings. Dependency-only here" },

  # -- audio
  { name = "pipewire", source = "repo", why = "the audio server, and `pw-dump` - scripts/blackwall-audio:52 walks pw-dump's object graph because pactl's source list is incomplete. Dependency-only here" },
  { name = "pipewire-pulse", source = "repo", why = "PulseAudio replacement; pavucontrol and pactl talk to it" },
  { name = "pipewire-alsa", source = "repo", why = "ALSA compatibility for cava and anything not PulseAudio-aware" },
  { name = "wireplumber", source = "repo", why = "`wpctl`, the volume and mute path for every media key (keybinds.conf:165-168) and waybar/modules/pulseaudio.json scroll. Dependency-only here" },
  { name = "libpulse", source = "repo", why = "`pactl`, used by scripts/blackwall-audio alongside pw-dump. Dependency-only here" },
  { name = "pavucontrol", source = "repo", why = "right-click on the waybar volume module (waybar/modules/pulseaudio.json:51)" },
  { name = "playerctl", source = "repo", why = "media keys (keybinds.conf:182-185) and waybar/modules/custom.jsonc prev/play/next. Dependency-only here" },

