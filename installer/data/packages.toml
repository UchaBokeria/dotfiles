  { name = "wallust", source = "aur", why = "generates the palette from the wallpaper; wallust/ holds the config and templates, and scripts/setwall runs it" },
  { name = "python", source = "repo", why = "runs theme/blackwall_theme (blackwall-theme, the one generator that feeds every surface) and scripts/blackwall-audio-devices.py. Pure stdlib, no third-party imports" },
  { name = "imagemagick", source = "repo", why = "`magick` in scripts/blackwall-shot - preprocesses the capture several ways before OCR. Dependency-only here" },

