  { name = "thunar", source = "repo", why = "$fileManager in keybinds.conf:5 (SUPERSHIFT+F); Thunar/uca.xml and the generated thunar.css are part of the theme" },
  { name = "imv", source = "repo", why = "the preferred image viewer in blackwall-net:328 (wifi QR) and Thunar/uca.xml 'Open in imv'" },
  { name = "gvfs", source = "repo", why = "GAP - NOT INSTALLED HERE. Thunar without gvfs cannot mount a USB stick, has no Trash and no network browsing: the sidebar entries are simply absent. Every Thunar setting in links.toml assumes a file manager that can do those things" },
