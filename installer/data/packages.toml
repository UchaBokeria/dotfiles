  { name = "brightnessctl", source = "repo", why = "XF86MonBrightness keys (keybinds.conf:178-179)" },
  { name = "ddcutil", source = "repo", why = "external-monitor brightness over i2c; scripts/blackwall-dim:22 setvcp 10 and eww/scripts/ios/dim.sh getvcp 10" },

