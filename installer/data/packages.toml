  # yay is NOT listed as a package. It is the AUR helper, so pacman cannot
  # install it and listing it means asking yay to install yay: on a fresh box
  # the `aur-helper` step has already put yay-bin there, and `yay -S yay` then
  # compiles the Go source of a package that CONFLICTS with the working one it
  # is replacing. Whichever of yay/paru/pikaur/trizen exists satisfies
  # everything here - src/exec.rs looks for all four.
