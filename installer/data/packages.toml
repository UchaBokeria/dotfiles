#  blackwall - package inventory
#
#  Every package a fresh Arch box needs to become this machine, classified into
#  a required core plus optional groups the installer ticks. Generated by
#  inspecting the live machine read-only (`pacman -Qqe`, `pacman -Qqm`,
#  `pacman -Qo $(command -v ...)`) and by grepping the repo for every binary it
#  actually invokes - scripts/, hypr/, eww/, waybar/, rofi/, fish/, tmux/,
#  archpilot/, theme/, whatsapp/, tools/. Nothing here is guessed: each `why`
#  names the thing that calls it.
#
#  Read with installer/src/data.rs. Schema:
#    [meta]                     host / aur helper / pinned versions
#    [[group]]                  name, required, description, packages = [...]
#    { name, source, why }      source is "repo" or "aur"
#
#  IMPORTANT - `pacman -Qqe` on this machine is NOT this file. 22 packages the
#  rice genuinely needs are installed here only as dependencies of something
#  else (playerctl, ddcutil, qrencode, imagemagick, ffmpeg, python-gobject,
#  gtk4, wireplumber, pipewire, libnotify, xdg-utils, xdg-user-dirs, polkit,
#  gnome-keyring, ttf-nerd-fonts-symbols, tesseract, go, nodejs, ...). They are
#  listed explicitly below, because on a fresh box nothing would pull them in
#  and the rice would come up silently broken. Conversely the 21 `*-debug`
#  foreign packages yay leaves behind are NOT listed: they are build artefacts,
#  not installs.

[meta]
generated = "2026-09-14"
host = "archlinux"
arch_release = "Arch Linux (rolling, BUILD_ID=rolling)"
kernel = "6.18.46-1-lts"
hardware = "Intel NUC10i7FNH"
aur_helper = "yay"
hyprland = "0.56.2"
waybar = "0.15.0"
eww = "0.6.0"
note = """
Version-sensitive, in order of how loudly they break:

  hyprland 0.56.2   The hyprglass plugin is a compositor plugin and is built
                    against one exact Hyprland version. scripts/blackwall-glass
                    picks the hyprglass git tag whose `.hyprland-version` file
                    equals `hyprctl version`, and refuses to build if none
                    matches. Upgrading Hyprland without rebuilding the plugin
                    loses all glass; upgrading past a release hyprglass has not
                    caught up with loses it until it does.

  hyprland >= 0.56  The LUA config is what loads: hypr/hyprland.lua is a
                    symlink to lua/hyprland.lua, and Hyprland prefers .lua over
                    .conf when both exist. hypr/hyprland.conf is kept as the
                    fallback only. Under Lua, `hyprctl dispatch` takes a Lua
                    expression, which is why the waybar workspace pills and
                    ArchPilot's self-resize use Lua dispatch strings.

  eww 0.6.0         Installed here. The configs and comments were written
                    against 0.5.0 and still say so (eww/widgets/calendar.yuck,
                    scripts/blackwall-cal-ui, scripts/blackwall-vpn): `:focusable`
                    is one boolean meaning *exclusive* keyboard grab, so the
                    panels deliberately never set it. Keep that rule on 0.6.

  waybar 0.15.0     workspaces.json declares ten custom modules that shell out
                    to scripts/blackwall-bar-workspaces rather than using
                    hyprland/workspaces.

  wacli >= 0.18     whatsapp/README.md: "wacli 0.18 or newer, authenticated".
  go >= 1.22        whatsapp/go.mod `go 1.22`.
  python >= 3.13    archpilot/pyproject.toml `requires-python = ">=3.13"`.
"""

# ---------------------------------------------------------------------- core --

