required = false
description = "The coding agents: opencode with its MCP servers, and the CLIs ArchPilot drives."
packages = [
  { name = "npm", source = "repo", why = "`npm ci` rebuilds opencode's node_modules (5 MCP servers and plugins). Also how claude and codex are installed. Already pulled in by nodejs here, listed so ticking this group alone is enough" },
]
note = """
The programs in this group mostly are NOT pacman packages, which is why the
group has almost nothing in it and two steps instead:

  * step `opencode-bin`  - the opencode CLI into ~/.opencode/bin, from the
                           official installer. extra/opencode is a different
                           major line (2.x vs the 1.18.31 this config targets).
  * step `opencode-deps` - `npm ci` inside opencode/, for the MCP servers
                           opencode.json names by path.
  * ~/.local/bin/claude and ~/.local/bin/codex are installed with npm by hand;
    ArchPilot offers whichever it finds (archpilot/src/archpilot/engine/).

The opencode config itself is a [[link]]: ~/.config/opencode -> opencode/ in
this repo.
"""

[[group]]
name = "misc"
required = false
description = "Explicitly installed, attributable, but one-off. Nothing in the rice depends on any of these."
packages = [
  { name = "gsimplecal", source = "repo", why = "a GTK calendar. gsimplecal/config is in this repo and is linked, but NOTHING invokes it - the calendar the rice actually shows is eww/widgets/calendar.yuck driven by scripts/blackwall-cal. Kept because the config is shipped; drop both if you want" },
  { name = "zen", source = "aur", why = "a C library ('Reduce your stress with the C language'), AUR, last upstream release 2020. One-off experiment - no reference anywhere in the repo. Not to be confused with zen-browser-bin" },
]
note = """
Also present and deliberately NOT listed anywhere in this file:

  * 21 `*-debug` foreign packages (accounts-qml-module-debug, eww-debug,
    wallust-debug, yay-debug, ...). These are the detached-debug-symbol
    packages yay produces when `options=(debug)` is set in makepkg.conf. None
    is explicitly installed, none is a dependency of anything, and a fresh box
    regenerates its own. Installing them is meaningless.

  * 23 AUR packages pulled in purely as dependencies of the AUR packages above:
    python-hyprland-{config,monitors,schema,socket,state} (hyprmod-git),
    python-fvs / fvs2 / patool / python-steamgriddb (bottles),
    gprbuild-toolbox / gprname (the Ada toolchain), vkbasalt-cli, libpng12,
    openssl-1.1, libsoup, gconf, litehtml0.9, accounts-qml-module,
    python-e3-core, python-e3-testsuite, python-pathvalidate,
    python-pkg_resources, python-setuptools-reproducible.
    yay resolves these itself; listing them would only pin them.

  * Things on PATH that pacman does not own and this file cannot install:
      ~/.local/bin/uv        shadows the `uv` package listed in core
      ~/.local/bin/claude    the Claude Code CLI archpilot drives (npm)
      ~/.local/bin/codex     the other engine archpilot offers (npm)
      ~/.local/bin/wa        built from whatsapp/ by `go build`
      ~/.local/share/nvm/... the node/npm actually first on PATH
      ~/dev/cloud/bin/kitty-smart-paste  kitty.conf:155 maps a key to it
    The installer has to place these itself; `pacman -S` will not.
"""

