# --------------------------------------------------------------------- fonts --

[[group]]
name = "fonts"
required = true
description = "Required. Every bar, panel and menu names these families explicitly; a missing one is a row of tofu."
note = """
GAPS. Families the configs name that pacman cannot supply on a fresh box:

  MesloLGS NF         NOT INSTALLED HERE EITHER. kitty/kitty.conf:23 sets it as
                      font_family - the primary terminal face - and
                      eww/tokens.scss:62 uses it for $font_mono.
                      `fc-match "MesloLGS NF"` answers NotoSans-Regular today.
                      FIX: ttf-meslo-nerd, listed above.

  Iosevka Nerd Font   Satisfied only by a hand-dropped
                      ~/.local/share/fonts/Iosevka-Nerd-Font-Complete.ttf.
                      7 references, all in the vendored rofi themes.
                      FIX: ttf-iosevka-nerd, listed above.

  feather             ~/.local/share/fonts/Icomoon-Feather.ttf - hand-dropped,
                      pacman knows nothing about it. ~35 references: every
                      rofi applet and launcher icon row ("feather 24",
                      "feather bold 32"), e.g. rofi/applets/type-3/style-2.rasi:125.
                      NO PACKAGE EXISTS. The installer must ship the .ttf.

  Grape Nuts          ~/.local/share/fonts/GrapeNuts-Regular.ttf - hand-dropped.
                      2 references, decorative. No package. Ship it.

  Open Sans           /usr/share/fonts/OpenSans, not pacman-owned. The active
                      SDDM theme names it (sddm-astronaut-theme/Themes/astronaut.conf:9).
                      sddm-astronaut-theme/setup.sh:140 copies it out of the
                      theme's own Fonts/ directory, so running that installer
                      covers it. `ttf-opensans` is also in the repos.

  SF Pro Text         Named first in eww/tokens.scss:61, wlogout/style.css:20
                      and theme/blackwall_theme/tokens.py:300. Deliberate
                      macOS-first fallback - Inter catches it. Do not chase it.
"""
packages = [
  { name = "ttf-jetbrains-mono-nerd", source = "repo", why = "'JetBrains Mono Nerd Font' / 'JetBrainsMono Nerd Font' - 57 references, the main UI face across waybar, eww, rofi and kitty" },
  { name = "ttf-nerd-fonts-symbols", source = "repo", why = "'Symbols Nerd Font' - 20 references. The glyph-only face the GTK panels set on the label itself; it is the only one that renders those icons correctly. Installed here only as a dependency, so it is easy to lose" },
  { name = "inter-font", source = "repo", why = "'Inter' - the GTK UI font (gtk-font-name=Inter 10 in ~/.config/gtk-3.0/settings.ini, per installer/data/links.toml)" },
  { name = "noto-fonts", source = "repo", why = "'Noto Sans' - the GTK4/libadwaita and ~/.gtkrc-2.0 default, and the CJK/fallback coverage" },
  { name = "ttf-meslo-nerd", source = "repo", why = "'MesloLGS NF' - kitty/kitty.conf:23 font_family, i.e. the PRIMARY TERMINAL FACE, and eww/tokens.scss:62 $font_mono. NOT INSTALLED ON THIS MACHINE: fc-match 'MesloLGS NF' currently answers NotoSans-Regular, so every terminal is silently rendering in a proportional fallback. Install it" },
  { name = "ttf-iosevka-nerd", source = "repo", why = "'Iosevka Nerd Font', named by the vendored rofi launcher and powermenu themes. Satisfied here only by a hand-dropped ~/.local/share/fonts/Iosevka-Nerd-Font-Complete.ttf that pacman does not know about; this package provides the same family" },
  { name = "ttf-dejavu", source = "repo", why = "generic fallback; keeps rofi and Qt dialogs from falling back to something worse" },
]

