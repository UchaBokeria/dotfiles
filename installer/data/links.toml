kind = "copy"
personal = false
note = "Hand-written; kept in home/. gtk-font-name=Inter 10, icon=breeze, cursor=breeze_cursors/24, gtk-xft-dpi=98304, gtk-modules=colorreload-gtk-module, decoration-layout icon:minimize,maximize,close, toolbar-style 3."

[[link]]
