# blackwall - what goes where.
#
# Repaired from the machine inventory: entries whose source did not exist
# in the repo were either adopted into home/ or moved to [[gap]], because a
# catalogue entry that cannot succeed is worse than one that is absent.
#
# kind: symlink (we own it) | copy (the app rewrites it) | generated
# (written by theme/blackwall-theme - never linked, or the generator would
# be writing through its own symlink).

[meta]
generated = "2026-09-14"
home = "~"

[[link]]
repo = "hypr"
target = "~/.config/hypr"
kind = "symlink"
personal = false
note = "the whole Hyprland config; hypr/hyprland.lua is itself a symlink to lua/hyprland.lua and is what loads. Swap that link to hyprland.conf to fall back to the .conf tree."

[[link]]
repo = "waybar"
target = "~/.config/waybar"
kind = "symlink"
personal = false
note = "the bar; style.css is hand-written, tokens.css is generated"

[[link]]
repo = "eww"
target = "~/.config/eww"
kind = "symlink"
personal = false
note = "control centre, calendar, clocks, audio, wifi widgets"

[[link]]
repo = "rofi"
target = "~/.config/rofi"
kind = "symlink"
personal = false
note = "launchers; rofi/shared/blackwall.rasi is generated"

[[link]]
repo = "rofi"
target = "~/.config/rofi.scriptkid"
kind = "symlink"
personal = true
note = "SECOND link to the same dir, named after the user. rofi-network-manager looks for a per-user rofi dir. Rename to ~/.config/rofi.$USER on a generic machine."

[[link]]
repo = "fish"
target = "~/.config/fish"
kind = "symlink"
personal = false
note = "the interactive shell. config.fish auto-attaches tmux session 'default', sets fish_vi_key_bindings, starship and zoxide. NOTE: the login shell in /etc/passwd is /bin/bash - fish is reached via kitty's `shell /bin/fish`."

[[link]]
repo = "tmux"
target = "~/.config/tmux"
kind = "symlink"
personal = false
note = "oh-my-tmux; tmux.conf.local carries a generated colour block. Ten tpm submodules under tmux/plugins - run `git submodule update --init --recursive`."

[[link]]
repo = "kitty"
target = "~/.config/kitty"
kind = "symlink"
personal = false
note = "terminal; background_opacity 0.40, font MesloLGS NF, shell /bin/fish. colors.conf is generated."

[[link]]
repo = "nvim"
target = "~/.config/nvim"
kind = "symlink"
personal = false
note = "lua/custom/blackwall_palette.lua is generated. lazy-lock.json is gitignored - see the untracked list below."

[[link]]
repo = "mako"
target = "~/.config/mako"
kind = "symlink"
personal = false
note = "fallback notification daemon; mako/config is generated. mako.service is MASKED on this machine (swaync owns org.freedesktop.Notifications)."

[[link]]
repo = "cava"
target = "~/.config/cava"
kind = "symlink"
personal = false
note = "audio visualiser; cava/config is generated"

[[link]]
repo = "wlogout"
target = "~/.config/wlogout"
kind = "symlink"
personal = false
note = "power menu; colors/tokens.css is generated"

[[link]]
repo = "wallust"
target = "~/.config/wallust"
kind = "symlink"
personal = false
note = "wallust.toml plus five templates; run by scripts/setwall before blackwall-theme"

[[link]]
repo = "wallpapers"
target = "~/.config/wallpapers"
kind = "symlink"
personal = false
note = "the picture set. ~/.cache/last_wallpaper holds the current pick; hypr/scripts/last_wallpaper restores it at login and falls back to wallpapers/cyberpunk.png."

[[link]]
repo = "scripts"
target = "~/.config/scripts"
kind = "symlink"
personal = false
note = "every blackwall-* helper. Also needs `sudo scripts/link-bin` to reach /usr/local/bin."

[[link]]
repo = "Thunar"
target = "~/.config/Thunar"
kind = "symlink"
personal = false
note = "accels.scm (keyboard accelerators) and uca.xml (custom actions). The toolbar item `uca-action-1765909381560005-1` in the xfconf thunar channel refers to an entry in uca.xml - install both or the toolbar loses a button."

[[link]]
repo = "imv"
target = "~/.config/imv"
kind = "symlink"
personal = false
