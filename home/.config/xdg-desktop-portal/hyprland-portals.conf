# Which portal backend answers which request under XDG_CURRENT_DESKTOP=Hyprland.
#
# Without this file xdg-desktop-portal picked xdg-desktop-portal-gtk for
# Screenshot, because gtk was the only backend already running - and the GTK
# backend cannot grab a Hyprland screen, so flameshot reported "Screenshot
# aborted" and nothing was captured. hyprland answers the screen-facing
# requests; gtk keeps the file dialog, which is the one it is good at.
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.Screenshot=hyprland
org.freedesktop.impl.portal.ScreenCast=hyprland
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.Settings=gtk
