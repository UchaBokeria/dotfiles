# ArchPilot config. Every key has a default (see DEFAULTS in config.py),
# so this file is optional.

[ui]
on_submit = "toggle"
notify_on_complete = true

[model]
default = "haiku"            # override per prompt with :sonnet / :opus

[effort]
default = "medium"          # low | medium | high | xhigh | max

[mode]
default = "ask"             # ask | action

[safety]
approval_deadline_s = 240
auto_commit = true
